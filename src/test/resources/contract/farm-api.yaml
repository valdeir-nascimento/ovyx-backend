      summary: Excluir pesagem
      description: |
        A pesagem sai do histórico, do gráfico e da última pesagem da gaiola, mas não é apagada: fica
        guardada como anulada, com quem a anulou e quando. A data dela fica livre para uma nova pesagem.
        Anular de novo uma pesagem já anulada não muda nada.
      operationId: voidWeighing
      responses:
        '204':
          description: Pesagem anulada
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          description: Setor, gaiola ou pesagem inexistente, pesagem de outra gaiola, ou identificador malformado (`SECTOR_NOT_FOUND`, `CAGE_NOT_FOUND`, `WEIGHING_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                pesagemNaoEncontrada:
                  summary: Pesagem que não é desta gaiola
                  value:
                    code: WEIGHING_NOT_FOUND
                    title: Não encontrado
                    status: 404
                    detail: Pesagem não encontrada.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66/weighings/pesagem-24-09/voiding
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: A gaiola ou o setor estão inativos (`CAGE_INACTIVE`, `SECTOR_INACTIVE`), e as pesagens só se consultam.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gaiolaInativa:
                  summary: Exclusão em gaiola inativa
                  value:
                    code: CAGE_INACTIVE
                    title: Operação recusada
                    status: 409
                    detail: A gaiola está inativa; as pesagens dela são só para consulta.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66/weighings/7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d77/voiding
        '500':
          $ref: '#/components/responses/ErroInesperado'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de sessão emitido no login. `HttpOnly` e `SameSite=Lax`; `Secure` fora do perfil de desenvolvimento, que usa http.
  parameters:
    SectorId:
      name: sectorId
      in: path
      required: true
      description: Identificador do setor.
      schema:
        type: string
        format: uuid
      example: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
    CageId:
      name: cageId
      in: path
      required: true
      description: Identificador da gaiola.
      schema:
        type: string
        format: uuid
      example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
    WeighingId:
      name: weighingId
      in: path
      required: true
      description: Identificador da pesagem.
      schema:
        type: string
        format: uuid
      example: 7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d77
  responses:
    SessaoInvalida:
      description: Sem sessão válida (`UNAUTHENTICATED`), ou responsável inativado com a sessão aberta (`CARETAKER_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semSessao:
              summary: Sem sessão
              value:
                code: UNAUTHENTICATED
                title: Não autenticado
                status: 401
                detail: Sua sessão expirou. Entre novamente para continuar.
                instance: /api/v1/sectors
    SemPermissao:
      description: Sem o perfil Administrador (`FORBIDDEN`), sem o token de proteção (`CSRF_TOKEN_INVALID`) ou com a troca de senha pendente (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              summary: Usuário comum tentando alterar
              value:
                code: FORBIDDEN
                title: Acesso negado
                status: 403
                detail: Você não tem permissão para executar esta operação.
                instance: /api/v1/sectors
            tokenCsrfAusente:
              summary: Escrita sem o cabeçalho X-XSRF-TOKEN
              value:
                code: CSRF_TOKEN_INVALID
                title: Proteção da requisição ausente
                status: 403
                detail: O token de proteção da requisição está ausente ou expirou. Recarregue a página e tente novamente.
                instance: /api/v1/sectors
    TrocaDeSenhaPendente:
      description: Troca de senha pendente (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            trocaDeSenhaPendente:
              summary: Senha provisória ainda não trocada
              value:
                code: PASSWORD_CHANGE_REQUIRED
                title: Troca de senha obrigatória
                status: 403
                detail: É necessário trocar a senha antes de executar qualquer outra operação.
                instance: /api/v1/sectors
    SetorNaoEncontrado:
      description: Setor inexistente, ou identificador malformado (`SECTOR_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            setorNaoEncontrado:
              summary: Identificador que não é de nenhum setor
              value:
                code: SECTOR_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Setor não encontrado.
                instance: /api/v1/sectors/galpao-9
    GaiolaNaoEncontrada:
      description: Setor ou gaiola inexistente, gaiola de outro setor, ou identificador malformado (`SECTOR_NOT_FOUND` ou `CAGE_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gaiolaNaoEncontrada:
              summary: Gaiola que não é deste setor
              value:
                code: CAGE_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Gaiola não encontrada.
                instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/b-07
    PesagemNaoEncontrada:
      description: Setor, gaiola ou pesagem inexistente, pesagem anulada ou de outra gaiola, ou identificador malformado (`SECTOR_NOT_FOUND`, `CAGE_NOT_FOUND`, `WEIGHING_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            pesagemNaoEncontrada:
              summary: Pesagem anulada
              value:
                code: WEIGHING_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Pesagem não encontrada.
                instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66/weighings/7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d77
    FiltroInvalido:
      description: Página fora do permitido ou situação desconhecida (`VALIDATION_FAILED`). Situação desconhecida traz o nome do parâmetro em `details`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            paginaInvalida:
              summary: Tamanho de página acima de 100
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: A requisição contém campos inválidos.
                instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages
                details:
                  size: O tamanho da página deve estar entre 1 e 100.
            situacaoInvalida:
              summary: Situação fora da lista
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: Valor inválido para o parâmetro 'status'.
                instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages
                details:
                  parameter: status
    FiltroDaExportacaoInvalido:
      description: Situação desconhecida (`VALIDATION_FAILED`), com o nome do parâmetro em `details`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            situacaoInvalida:
              summary: Situação fora da lista
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: Valor inválido para o parâmetro 'status'.
                instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/export
                details:
                  parameter: status
    FormatoIndisponivel:
      description: Formato de resposta indisponível (`REQUEST_NOT_ACCEPTABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequisicaoNaoSuportada:
      description: Corpo em formato diferente de JSON (`REQUEST_NOT_ACCEPTABLE`, 415).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ErroInesperado:
      description: Falha inesperada (`INTERNAL_ERROR`), sem detalhe da causa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Status:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: Situação do setor ou da gaiola.
    StatusFilter:
      type: string
      enum: [ACTIVE, INACTIVE, ALL]
      default: ACTIVE
      description: Filtro de situação das listas; `ALL` traz ativos e inativos.
    SectorRequest:
      type: object
      description: Cadastro ou edição de setor
      required: [name, layingRateTarget]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: Nome do setor, único entre os ativos
          example: Codornas — Galpão 4
        description:
          type: string
          maxLength: 500
          description: Espécie, linhagem, galpão ou o que ajude a reconhecer o setor
          example: Codornas japonesas em postura, baterias A e B
        minimumWeight:
          type: integer
          minimum: 1
          maximum: 10000
          description: Peso mínimo de referência das aves, em gramas. Vai junto do máximo; sem os dois, o setor fica sem faixa.
          example: 155
        maximumWeight:
          type: integer
          minimum: 1
          maximum: 10000
          description: Peso máximo de referência das aves, em gramas, maior que o mínimo
          example: 175
        layingRateTarget:
          type: number
          description: >-
            Meta de produtividade do setor: a porcentagem de ovos coletados sobre as aves alojadas
            esperada por dia, de 1 a 100, com até uma casa decimal. Número ou texto, com vírgula ou ponto.
          example: 85
        weighingDay:
          type: string
          description: >-
            Dia da semana da pesagem das aves do setor, de `MONDAY` a `SUNDAY`. Ausente, nulo ou vazio, o setor fica sem
            dia fixo e segue o prazo de 7 dias desde a última pesagem de cada gaiola. Outro valor é recusado no campo
            `weighingDay`, junto das demais falhas.
          example: FRIDAY
    SectorSummary:
      type: object
      description: Setor na lista, com os totais das gaiolas ativas e a meta de produtividade
      required: [id, name, status, activeCageCount, birdCount, layingRateTarget]
      properties:
        id:
          type: string
          format: uuid
          example: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
        name:
          type: string
          example: Codornas — Galpão 1
        description:
          type: string
          example: Codornas japonesas em postura, baterias A a D
        status:
          $ref: '#/components/schemas/Status'
        activeCageCount:
          type: integer
          description: Quantidade de gaiolas ativas
          example: 48
        birdCount:
          type: integer
          description: Soma das aves das gaiolas ativas
          example: 2400
        referenceWeight:
          $ref: '#/components/schemas/ReferenceWeight'
        layingRateTarget:
          type: number
          minimum: 1
          maximum: 100
          multipleOf: 0.1
          description: Meta de produtividade do setor, em porcentagem, com uma casa decimal
          example: 85.0
        weighingDay:
          $ref: '#/components/schemas/WeighingDay'
    SectorDetail:
      allOf:
      - $ref: '#/components/schemas/SectorSummary'
      - type: object
        required: [batteries, createdAt, updatedAt]
        properties:
          batteries:
            type: array
            description: Baterias que as gaiolas do setor usam, ativas ou inativas, em ordem; é o filtro de bateria da lista de gaiolas
            items:
              type: string
            example: [A, B, C, D]
          createdAt:
            type: string
            format: date-time
            example: '2026-09-20T10:15:00Z'
          updatedAt:
            type: string
            format: date-time
            example: '2026-09-24T17:40:12Z'
    CageRequest:
      type: object
      description: Cadastro ou edição de gaiola
      required: [battery, number, birdCount]
      properties:
        battery:
          type: string
          minLength: 1
          maxLength: 3
          description: Bateria, com até 3 letras ou dígitos; gravada em maiúsculas
          example: B
        number:
          type: integer
          minimum: 1
          maximum: 999
          description: Número inteiro da gaiola na bateria
          example: 7
        birdCount:
          type: integer
          minimum: 0
          maximum: 1000
          description: Quantidade inteira de aves; zero é gaiola vazia
          example: 50
    CageSummary:
      type: object
      description: Gaiola na lista
      required: [id, sectorId, code, battery, number, birdCount, status]
      properties:
        id:
          type: string
          format: uuid
          example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
        sectorId:
          type: string
          format: uuid
          example: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
        code:
          type: string
          description: Bateria, hífen e número com ao menos dois dígitos
          example: B-07
        battery:
          type: string
          example: B
        number:
          type: integer
          example: 7
        birdCount:
          type: integer
          example: 50
        status:
          $ref: '#/components/schemas/Status'
        lastWeighing:
          $ref: '#/components/schemas/WeighingPoint'
        weighing:
          $ref: '#/components/schemas/WeighingStanding'
    CageDetail:
      allOf:
      - $ref: '#/components/schemas/CageSummary'
      - type: object
        required: [createdAt, updatedAt]
        properties:
          createdAt:
            type: string
            format: date-time
            example: '2026-09-21T08:30:00Z'
          updatedAt:
            type: string
            format: date-time
            example: '2026-09-24T17:42:05Z'
    CagePage:
      type: object
      description: Uma página da pesquisa de gaiolas, com os totais de todas as páginas
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CageSummary'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 48
        totalPages:
          type: integer
          example: 3
    ReferenceWeight:
      type: object
      description: Faixa de peso de referência das aves do setor, em gramas, com os limites incluídos; ausente sem faixa
      required: [minimum, maximum]
      properties:
        minimum:
          type: integer
          example: 155
        maximum:
          type: integer
          example: 175
    WeightRangeStatus:
      type: string
      enum: [WITHIN, OUTSIDE, NO_RANGE]
      description: A última pesagem diante da faixa do setor; `NO_RANGE` quando o setor não tem faixa.
    WeighingDay:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      description: Dia da semana da pesagem do setor; ausente quando o setor segue o prazo de 7 dias.
      example: FRIDAY
    WeighingSituation:
      type: string
      enum: [UP_TO_DATE, DUE_TODAY, LATE, NEVER_WEIGHED]
      description: >-
        A pesagem da semana de uma gaiola ativa: em dia; a pesar hoje (é o dia da pesagem e falta a da semana);
        atrasada (o dia passou sem ela, ou a última tem mais de 7 dias sem dia definido); nunca pesada.
    WeighingStanding:
      type: object
      description: >-
        A situação da pesagem de uma gaiola ativa de setor ativo, calculada com o dia de hoje da granja. Ausente na
        gaiola inativa e nas gaiolas de setor inativo.
      required: [situation]
      properties:
        situation:
          $ref: '#/components/schemas/WeighingSituation'
        lateSince:
          type: string
          format: date
          description: >-
            Só na atrasada: o último dia de pesagem que passou sem ela; sem dia definido, o dia seguinte ao fim do
            prazo de 7 dias.
          example: '2026-09-25'
        nextOn:
          type: string
          format: date
          description: 'Só na em dia: o próximo dia de pesagem; sem dia definido, 7 dias depois da última.'
          example: '2026-10-02'
    WeighingFilter:
      type: string
      enum: [PENDING]
      description: Filtro de pesagem da lista de gaiolas; `PENDING` traz as gaiolas ativas que faltam pesar.
    Actor:
      type: object
      description: Quem fez a operação, como estava na sessão
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          example: 5e7a9c1e-3b5d-4f7a-9c1e-3b5d7f9a1c22
        name:
          type: string
          example: Marina Alves
    WeighingRequest:
      type: object
      description: Registro ou correção de pesagem. O peso pode vir como número ou como texto, com vírgula ou ponto.
      required: [weighedOn, averageWeight]
      properties:
        weighedOn:
          type: string
          format: date
          description: Dia da pesagem, não futuro no fuso da granja
          example: '2026-09-24'
        averageWeight:
          type: number
          minimum: 1
          maximum: 10000
          description: Peso médio da amostra, em gramas, com até uma casa decimal
          example: 161.4
    WeighingPoint:
      type: object
      description: Uma pesagem resumida à data e ao peso
      required: [weighedOn, averageWeight]
      properties:
        weighedOn:
          type: string
          format: date
          example: '2026-09-24'
        averageWeight:
          type: number
          description: Peso médio, em gramas, com uma casa
          example: 161.0
    Weighing:
      type: object
      description: Uma pesagem válida da gaiola
      required: [id, weighedOn, averageWeight, recordedBy, recordedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d77
        weighedOn:
          type: string
          format: date
          example: '2026-09-24'
        averageWeight:
          type: number
          description: Peso médio da amostra, em gramas, com uma casa
          example: 161.4
        recordedBy:
          $ref: '#/components/schemas/Actor'
        recordedAt:
          type: string
          format: date-time
          example: '2026-09-24T10:12:40Z'
        lastCorrectedBy:
          $ref: '#/components/schemas/Actor'
        lastCorrectedAt:
          type: string
          format: date-time
          example: '2026-09-24T10:15:02Z'
    WeighingHistoryEntry:
      type: object
      description: Uma pesagem no histórico, com a variação sobre a anterior
      required: [id, weighedOn, averageWeight, recordedBy]
      properties:
        id:
          type: string
          format: uuid
          example: 7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d77
        weighedOn:
          type: string
          format: date
          example: '2026-09-24'
        averageWeight:
          type: number
          example: 161.0
        change:
          type: number
          description: Peso desta pesagem menos o da anterior, em gramas, com uma casa; ausente na primeira
          example: 3.0
        recordedBy:
          $ref: '#/components/schemas/Actor'
        lastCorrectedBy:
          $ref: '#/components/schemas/Actor'
    FourWeekChange:
      type: object
      description: A última pesagem menos a pesagem mais recente feita até 28 dias antes dela
      required: [change, since]
      properties:
        change:
          type: number
          description: A variação, em gramas, com uma casa
          example: 11.0
        since:
          type: string
          format: date
          description: O dia da pesagem de referência
          example: '2026-08-27'
    WeighingOverview:
      type: object
      description: O acompanhamento do peso da gaiola, para a tela Peso médio
      required: [cage, sector, chart, history]
      properties:
        cage:
          type: object
          required: [id, code, battery, number, birdCount, status]
          properties:
            id:
              type: string
              format: uuid
              example: 2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66
            code:
              type: string
              example: A-01
            battery:
              type: string
              example: A
            number:
              type: integer
              example: 1
            birdCount:
              type: integer
              example: 48
            status:
              $ref: '#/components/schemas/Status'
        sector:
          type: object
          required: [id, name, status]
          properties:
            id:
              type: string
              format: uuid
              example: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
            name:
              type: string
              example: Codornas — Galpão 1
            status:
              $ref: '#/components/schemas/Status'
            referenceWeight:
              $ref: '#/components/schemas/ReferenceWeight'
        latest:
          type: object
          description: A última pesagem válida; ausente sem pesagem
          required: [id, weighedOn, averageWeight]
          properties:
            id:
              type: string
              format: uuid
              example: 7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d77
            weighedOn:
              type: string
              format: date
              example: '2026-09-24'
            averageWeight:
              type: number
              example: 161.0
        fourWeekChange:
          $ref: '#/components/schemas/FourWeekChange'
        rangeStatus:
          $ref: '#/components/schemas/WeightRangeStatus'
        schedule:
          $ref: '#/components/schemas/WeighingStanding'
        chart:
          type: array
          description: As últimas 12 pesagens válidas, da mais antiga para a mais recente
          items:
            $ref: '#/components/schemas/WeighingPoint'
        history:
          type: array
          description: Todas as pesagens válidas, da mais recente para a mais antiga
          items:
            $ref: '#/components/schemas/WeighingHistoryEntry'
    Problem:
      type: object
      description: RFC 9457 Problem Details, com a extensão `code` do erro de aplicação. Igual ao da API de Identidade.
      required: [code, title, status]
      properties:
        code:
          type: string
          example: SECTOR_NAME_IN_USE
        title:
          type: string
          example: Operação recusada
        status:
          type: integer
          example: 409
        detail:
          type: string
