openapi: 3.1.0
info:
  title: Ovyx — API da Granja
  version: 1.0.0
  description: |
    Setores e gaiolas da granja (`Sector`, `Cage`): a estrutura produtiva onde as features
    seguintes lançam produção, ração, mortalidade e peso. Desde a feature 005, também a faixa de peso
    de referência do setor e as pesagens de cada gaiola (`Weighing`). Desde a feature 008, a meta de
    produtividade de cada setor, que o painel e o alerta de baixa postura usam.

    **Meta de produtividade**: obrigatória em todo setor, de 1 a 100%, com até uma casa decimal. Chega
    como número ou como texto ("82,5" e "82.5" são a mesma meta), e sai sempre como número. Os setores
    cadastrados antes da feature 008 ficaram com 85%.

    **Sessão, erros, CSRF e acesso negado**: iguais aos da API de Identidade
    (`specs/001-auth-foundation/contracts/identity-api.yaml`). Toda operação exige o cookie de
    sessão; toda escrita exige o cabeçalho `X-XSRF-TOKEN`; toda recusa segue RFC 9457 com a extensão
    `code`, e a de validação traz **todas** as violações de uma vez em `details`.

    **Perfis**: qualquer responsável autenticado consulta setores e gaiolas. Cadastrar, editar,
    inativar e reativar é exclusivo do perfil Administrador; o usuário comum recebe o 403 `FORBIDDEN`
    genérico, sem saber se o setor ou a gaiola existem. As pesagens são de qualquer responsável:
    registrar, corrigir e excluir.

    **Nada é apagado**: setores e gaiolas são inativados, e continuam consultáveis. Inativar um
    setor inativa junto as gaiolas ativas dele; reativá-lo traz de volta exatamente essas gaiolas.
    A pesagem excluída fica guardada como anulada, com quem a anulou e quando, e sai das leituras.

    **Agenda de pesagem** (feature 010): o setor pode ter um dia da semana para a pesagem (`weighingDay`). A
    pesagem da semana é a feita nos 7 dias que terminam no último dia de pesagem que já chegou, ou depois dele; sem
    dia definido, vale o prazo de 7 dias desde a última pesagem. Cada gaiola ativa de setor ativo tem a situação
    (`WeighingStanding`): em dia, a pesar hoje, atrasada ou nunca pesada. A situação depende de hoje, no fuso da
    granja, e não é gravada.

    **Planilhas**: a lista de gaiolas de um setor também sai como planilha do Excel (.xlsx), com a
    busca e os filtros da tela e todas as páginas. Quantidades, pesos e datas são números e datas na
    planilha, e não texto; a gaiola nunca pesada fica com o peso em branco. A recusa de uma exportação
    é a mesma de qualquer operação: `application/problem+json`, e não uma planilha.
servers:
- url: http://localhost:8080
  description: Ambiente local
tags:
- name: Setores
  description: Cadastro, consulta, inativação e reativação de setores
- name: Gaiolas
  description: Cadastro, consulta, inativação e reativação das gaiolas de um setor
- name: Pesagens
  description: O peso médio das aves de cada gaiola, semana a semana, e o acompanhamento diante da faixa do setor
paths:
  /api/v1/sectors:
    get:
      tags: [Setores]
      summary: Listar setores
      description: Setores com a quantidade de gaiolas ativas e a soma das aves delas, por nome.
      operationId: listSectors
      parameters:
      - name: status
        in: query
        description: Situação dos setores listados — ativos, inativos ou todos (`ALL`); ausente, só os ativos.
        schema:
          $ref: '#/components/schemas/StatusFilter'
        example: ACTIVE
      responses:
        '200':
          description: Setores encontrados, possivelmente nenhum
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectorSummary'
              examples:
                setoresAtivos:
                  summary: Dois setores ativos
                  value:
                  - id: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    name: Codornas — Galpão 1
                    description: Codornas japonesas em postura, baterias A a D
                    status: ACTIVE
                    activeCageCount: 48
                    birdCount: 2400
                    layingRateTarget: 85.0
                    weighingDay: FRIDAY
                  - id: 7a1b9c3d-2e4f-4a6b-8c0d-5e7f9a1b3c22
                    name: Poedeiras brancas — Galpão 2
                    description: Linhagem Hy-Line W-36 em gaiolas convencionais
                    status: ACTIVE
                    activeCageCount: 24
                    birdCount: 1200
                    layingRateTarget: 72.0
        '400':
          description: Situação desconhecida (`VALIDATION_FAILED`), com o nome do parâmetro em `details`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                situacaoInvalida:
                  summary: Situação fora da lista
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Valor inválido para o parâmetro 'status'.
                    instance: /api/v1/sectors
                    details:
                      parameter: status
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    post:
      tags: [Setores]
      summary: Cadastrar setor
      operationId: registerSector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
            examples:
              novoSetor:
                summary: Galpão de codornas, com a faixa de peso
                value:
                  name: Codornas — Galpão 4
                  description: Codornas japonesas em postura, baterias A e B
                  minimumWeight: 155
                  maximumWeight: 175
                  layingRateTarget: 85
                  weighingDay: FRIDAY
      responses:
        '201':
          description: Setor cadastrado. O cabeçalho `Location` aponta para ele.
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorDetail'
              examples:
                setorCadastrado:
                  summary: Setor novo, sem gaiolas
                  value:
                    id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                    name: Codornas — Galpão 4
                    description: Codornas japonesas em postura, baterias A e B
                    status: ACTIVE
                    activeCageCount: 0
                    birdCount: 0
                    layingRateTarget: 85.0
                    weighingDay: FRIDAY
                    referenceWeight:
                      minimum: 155
                      maximum: 175
                    batteries: []
                    createdAt: '2026-09-25T13:02:11Z'
                    updatedAt: '2026-09-25T13:02:11Z'
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                camposInvalidos:
                  summary: Nome curto e descrição longa demais
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors
                    details:
                      name: O nome do setor deve ter ao menos 2 caracteres.
                      description: A descrição deve ter no máximo 500 caracteres.
                faixaInvertida:
                  summary: Faixa de peso com o mínimo acima do máximo
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors
                    details:
                      minimumWeight: O peso mínimo deve ser menor que o máximo.
                metaForaDaFaixa:
                  summary: Meta de produtividade acima de 100%
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors
                    details:
                      layingRateTarget: A meta deve ficar entre 1% e 100%.
                diaInvalido:
                  summary: Dia da pesagem que não é um dia da semana
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors
                    details:
                      weighingDay: Escolha um dia da semana, de segunda a domingo.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: Outro setor ativo já usa o nome (`SECTOR_NAME_IN_USE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                nomeEmUso:
                  summary: Nome de um setor ativo
                  value:
                    code: SECTOR_NAME_IN_USE
                    title: Operação recusada
                    status: 409
                    detail: Já existe um setor ativo com este nome.
                    instance: /api/v1/sectors
                    details:
                      name: Já existe um setor ativo com este nome.
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags: [Setores]
      summary: Consultar setor
      operationId: findSector
      responses:
        '200':
          description: Setor encontrado, ativo ou inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorDetail'
              examples:
                setor:
                  summary: Setor com gaiolas
                  value:
                    id: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    name: Codornas — Galpão 1
                    description: Codornas japonesas em postura, baterias A a D
                    status: ACTIVE
                    activeCageCount: 48
                    birdCount: 2400
                    layingRateTarget: 85.0
                    weighingDay: FRIDAY
                    batteries: [A, B, C, D]
                    createdAt: '2026-09-20T10:15:00Z'
                    updatedAt: '2026-09-24T17:40:12Z'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    put:
      tags: [Setores]
      summary: Editar setor
      operationId: updateSector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorRequest'
            examples:
              edicao:
                summary: Nome, descrição, faixa de peso e meta corrigidos
                value:
                  name: Codornas — Galpão 1 (norte)
                  description: Codornas japonesas em postura, baterias A a D
                  minimumWeight: 155
                  maximumWeight: 175
                  layingRateTarget: '82,5'
                  weighingDay: FRIDAY
              semFaixa:
                summary: Faixa de peso retirada, sem os dois limites
                value:
                  name: Codornas — Galpão 1 (norte)
                  description: Codornas japonesas em postura, baterias A a D
                  layingRateTarget: 88
                  weighingDay: FRIDAY
      responses:
        '200':
          description: Setor atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorDetail'
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                nomeAusente:
                  summary: Nome em branco
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    details:
                      name: Informe o nome do setor.
                metaAusente:
                  summary: Meta de produtividade em branco
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    details:
                      layingRateTarget: Informe a meta de produtividade, de 1 a 100%.
                metaComDuasCasas:
                  summary: Meta com duas casas decimais
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    details:
                      layingRateTarget: Informe a meta em porcentagem, com até uma casa decimal.
                diaInvalido:
                  summary: Dia da pesagem que não é um dia da semana
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    details:
                      weighingDay: Escolha um dia da semana, de segunda a domingo.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: Outro setor ativo já usa o nome (`SECTOR_NAME_IN_USE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/deactivation:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    post:
      tags: [Setores]
      summary: Inativar setor
      description: Inativa o setor e, junto, todas as gaiolas ativas dele. Inativar um setor já inativo não muda nada.
      operationId: deactivateSector
      responses:
        '200':
          description: Setor inativado, com as gaiolas dele
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorDetail'
              examples:
                inativado:
                  summary: Setor e gaiolas inativados
                  value:
                    id: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    name: Codornas — Galpão 1
                    description: Codornas japonesas em postura, baterias A a D
                    status: INACTIVE
                    activeCageCount: 0
                    birdCount: 0
                    layingRateTarget: 85.0
                    batteries: [A, B, C, D]
                    createdAt: '2026-09-20T10:15:00Z'
                    updatedAt: '2026-09-25T14:03:51Z'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/reactivation:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    post:
      tags: [Setores]
      summary: Reativar setor
      description: Reativa o setor e as gaiolas que a inativação dele inativou; as que já estavam inativas antes continuam inativas.
      operationId: reactivateSector
      responses:
        '200':
          description: Setor reativado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorDetail'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: Outro setor ativo tomou o nome enquanto este esteve inativo (`SECTOR_NAME_IN_USE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/cages:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags: [Gaiolas]
      summary: Pesquisar gaiolas do setor
      description: Gaiolas do setor por bateria e número, com busca pelo código e filtros.
      operationId: searchCages
      parameters:
      - name: code
        in: query
        description: Trecho do código, sem distinguir maiúsculas (`B-07`, `b-0`, `07`).
        schema:
          type: string
          maxLength: 10
        example: B-07
      - name: battery
        in: query
        description: Só as gaiolas desta bateria.
        schema:
          type: string
          maxLength: 3
        example: B
      - name: status
        in: query
        description: Situação das gaiolas — ativas, inativas ou todas (`ALL`); ausente, só as ativas.
        schema:
          $ref: '#/components/schemas/StatusFilter'
        example: ACTIVE
      - name: weighing
        in: query
        description: >-
          `PENDING` traz só as gaiolas ativas que faltam pesar: sem pesagem válida na semana do setor, ou há mais de 7
          dias no setor sem dia definido. Combina com a busca e os outros filtros; ausente, sem filtro de pesagem.
        schema:
          $ref: '#/components/schemas/WeighingFilter'
        example: PENDING
      - name: page
        in: query
        description: Página, a partir de 0.
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: size
        in: query
        description: Gaiolas por página, de 1 a 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Página de gaiolas, possivelmente vazia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CagePage'
              examples:
                bateriaB:
                  summary: Busca por "B-07"
                  value:
                    content:
                    - id: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                      sectorId: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                      code: B-07
                      battery: B
                      number: 7
                      birdCount: 50
                      status: ACTIVE
                      lastWeighing:
                        weighedOn: '2026-09-18'
                        averageWeight: 161.0
                      weighing:
                        situation: LATE
                        lateSince: '2026-09-25'
                    page: 0
                    size: 20
                    totalElements: 1
                    totalPages: 1
        '400':
          $ref: '#/components/responses/FiltroInvalido'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    post:
      tags: [Gaiolas]
      summary: Cadastrar gaiola
      operationId: registerCage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CageRequest'
            examples:
              novaGaiola:
                summary: Gaiola B-13 com 50 codornas
                value:
                  battery: B
                  number: 13
                  birdCount: 50
      responses:
        '201':
          description: Gaiola cadastrada. O cabeçalho `Location` aponta para ela.
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/0e3f5a7b-2c4d-4e6f-9a8b-3c5d7e9f1a55
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CageDetail'
              examples:
                gaiolaCadastrada:
                  summary: Gaiola B-13
                  value:
                    id: 0e3f5a7b-2c4d-4e6f-9a8b-3c5d7e9f1a55
                    sectorId: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                    code: B-13
                    battery: B
                    number: 13
                    birdCount: 50
                    status: ACTIVE
                    createdAt: '2026-09-25T13:10:42Z'
                    updatedAt: '2026-09-25T13:10:42Z'
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                camposInvalidos:
                  summary: Bateria, número e aves inválidos
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages
                    details:
                      battery: Informe a bateria, com até 3 letras ou dígitos.
                      number: O número da gaiola deve ficar entre 1 e 999.
                      birdCount: A quantidade de aves deve ficar entre 0 e 1.000.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: Outra gaiola ativa do setor tem a bateria e o número (`CAGE_ALREADY_EXISTS`), ou o setor está inativo (`SECTOR_INACTIVE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gaiolaExistente:
                  summary: B-07 já existe no setor
                  value:
                    code: CAGE_ALREADY_EXISTS
                    title: Operação recusada
                    status: 409
                    detail: Já existe uma gaiola ativa B-07 neste setor.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages
                    details:
                      battery: Já existe uma gaiola ativa B-07 neste setor.
                      number: Já existe uma gaiola ativa B-07 neste setor.
                setorInativo:
                  summary: Setor inativo não recebe gaiolas
                  value:
                    code: SECTOR_INACTIVE
                    title: Operação recusada
                    status: 409
                    detail: O setor está inativo. Reative o setor antes de mexer nas gaiolas dele.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/cages/export:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags: [Gaiolas]
      summary: Exportar as gaiolas do setor para planilha
      description: 'As gaiolas do setor com a busca e os filtros da lista, de todas as páginas, como planilha do Excel: o código, a bateria, o número, as aves, a situação, a última pesagem válida, a situação dela diante da faixa de peso do setor e a situação da pesagem da semana (com a data do atraso). O cabeçalho traz a faixa, os filtros e os totais de gaiolas ativas e de aves. O arquivo se chama `gaiolas-<setor>.xlsx`.'
      operationId: exportCages
      parameters:
      - name: code
        in: query
        description: Trecho do código, sem distinguir maiúsculas, como na pesquisa.
        schema:
          type: string
          maxLength: 10
        example: B-0
      - name: battery
        in: query
        description: Só as gaiolas desta bateria.
        schema:
          type: string
          maxLength: 3
        example: B
      - name: status
        in: query
        description: Situação das gaiolas — ativas, inativas ou todas (`ALL`); ausente, só as ativas.
        schema:
          $ref: '#/components/schemas/StatusFilter'
        example: ACTIVE
      - name: weighing
        in: query
        description: >-
          `PENDING` traz só as gaiolas ativas que faltam pesar: sem pesagem válida na semana do setor, ou há mais de 7
          dias no setor sem dia definido. Combina com a busca e os outros filtros; ausente, sem filtro de pesagem.
        schema:
          $ref: '#/components/schemas/WeighingFilter'
        example: PENDING
      responses:
        '200':
          description: Planilha das gaiolas
          headers:
            Content-Disposition:
              description: O nome do arquivo, para salvar. O nome do setor sai simplificado, sem acento e com hífens.
              schema:
                type: string
              example: attachment; filename="gaiolas-codornas-galpao-1.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/FiltroDaExportacaoInvalido'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/cages/{cageId}:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    - $ref: '#/components/parameters/CageId'
    get:
      tags: [Gaiolas]
      summary: Consultar gaiola
      operationId: findCage
      responses:
        '200':
          description: Gaiola encontrada, ativa ou inativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CageDetail'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/GaiolaNaoEncontrada'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    put:
      tags: [Gaiolas]
      summary: Editar gaiola
      description: Troca a bateria, o número e a quantidade de aves. O setor da gaiola não muda.
      operationId: updateCage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CageRequest'
            examples:
              avesCorrigidas:
                summary: Quantidade de aves corrigida
                value:
                  battery: B
                  number: 7
                  birdCount: 48
      responses:
        '200':
          description: Gaiola atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CageDetail'
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/GaiolaNaoEncontrada'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: Outra gaiola ativa do setor tem a bateria e o número (`CAGE_ALREADY_EXISTS`), ou o setor está inativo (`SECTOR_INACTIVE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
