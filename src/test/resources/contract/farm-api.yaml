                    detail: Dados inválidos.
                    instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/cages/2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66/weighings
                    details:
