components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de sessão emitido no login. `HttpOnly` e `SameSite=Lax`; `Secure` fora do perfil de desenvolvimento, que usa http.
  parameters:
    SectorId:
      name: sectorId
      in: path
      required: true
      description: Identificador do setor.
      schema:
        type: string
        format: uuid
      example: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
    ReportId:
      name: reportId
      in: path
      required: true
      description: Identificador do relatório diário.
      schema:
        type: string
        format: uuid
      example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
    CageId:
      name: cageId
      in: path
      required: true
      description: Identificador da gaiola, o mesmo do cadastro de gaiolas.
      schema:
        type: string
        format: uuid
      example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
  responses:
    SessaoInvalida:
      description: Sem sessão válida (`UNAUTHENTICATED`), ou responsável inativado com a sessão aberta (`CARETAKER_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semSessao:
              summary: Sem sessão
              value:
                code: UNAUTHENTICATED
                title: Não autenticado
                status: 401
                detail: Sua sessão expirou. Entre novamente para continuar.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
    TrocaDeSenhaPendente:
      description: Troca de senha pendente (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            trocaDeSenhaPendente:
              summary: Senha provisória ainda não trocada
              value:
                code: PASSWORD_CHANGE_REQUIRED
                title: Troca de senha obrigatória
                status: 403
                detail: É necessário trocar a senha antes de executar qualquer outra operação.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
    EscritaSemProtecao:
      description: Escrita sem o token de proteção (`CSRF_TOKEN_INVALID`) ou com a troca de senha pendente (`PASSWORD_CHANGE_REQUIRED`). Qualquer perfil escreve; não há 403 de perfil.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tokenCsrfAusente:
              summary: Escrita sem o cabeçalho X-XSRF-TOKEN
              value:
                code: CSRF_TOKEN_INVALID
                title: Proteção da requisição ausente
                status: 403
                detail: O token de proteção da requisição está ausente ou expirou. Recarregue a página e tente novamente.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
            trocaDeSenhaPendente:
              summary: Senha provisória ainda não trocada
              value:
                code: PASSWORD_CHANGE_REQUIRED
                title: Troca de senha obrigatória
                status: 403
                detail: É necessário trocar a senha antes de executar qualquer outra operação.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
    SetorNaoEncontrado:
      description: Setor inexistente, ou identificador malformado (`SECTOR_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            setorNaoEncontrado:
              summary: Identificador que não é de nenhum setor
              value:
                code: SECTOR_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Setor não encontrado.
                instance: /api/v1/sectors/galpao-9/daily-reports
    RelatorioNaoEncontrado:
      description: Setor ou relatório inexistente, relatório de outro setor, ou identificador malformado (`SECTOR_NOT_FOUND` ou `DAILY_REPORT_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            relatorioNaoEncontrado:
              summary: Relatório que não é deste setor
              value:
                code: DAILY_REPORT_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Relatório não encontrado.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/24-09
    GaiolaDoRelatorioNaoEncontrada:
      description: Setor, relatório ou gaiola inexistente, gaiola que não está no relatório, ou identificador malformado (`SECTOR_NOT_FOUND`, `DAILY_REPORT_NOT_FOUND` ou `CAGE_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gaiolaForaDoRelatorio:
              summary: Gaiola cadastrada depois da abertura do relatório
              value:
                code: CAGE_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Gaiola não encontrada neste relatório.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/3b5d7f9b-1d3f-4b5d-8f9b-1d3f5b7d9f00
    SetorInativo:
      description: Lançamento num relatório de setor inativo (`SECTOR_INACTIVE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            setorInativo:
              summary: Setor inativado depois da abertura do relatório
              value:
                code: SECTOR_INACTIVE
                title: Operação recusada
                status: 409
                detail: O setor está inativo; os relatórios dele são só para consulta.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44/production
    FiltroInvalido:
      description: Página fora do permitido ou data em formato inválido (`VALIDATION_FAILED`). Data inválida traz o nome do parâmetro em `details`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            paginaInvalida:
              summary: Tamanho de página acima de 100
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: A requisição contém campos inválidos.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                details:
                  size: O tamanho da página deve estar entre 1 e 100.
            dataInvalida:
              summary: Data fora do formato AAAA-MM-DD
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: Valor inválido para o parâmetro 'collectionDate'.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                details:
                  parameter: collectionDate
    IntervaloInvalido:
      description: Intervalo recusado (`VALIDATION_FAILED`). As falhas das duas datas vêm todas de uma vez em `details`; data fora do formato AAAA-MM-DD traz o nome do parâmetro.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            datasFaltando:
              summary: Sem as duas datas
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: A requisição contém campos inválidos.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/export
                details:
                  from: Informe a data inicial.
                  to: Informe a data final.
            datasInvertidas:
              summary: A data inicial depois da final
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: A requisição contém campos inválidos.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/export
                details:
                  to: A data final deve ser igual ou posterior à inicial.
            intervaloLongo:
              summary: Mais de 366 dias
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: A requisição contém campos inválidos.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/export
                details:
                  to: O intervalo deve ter no máximo 366 dias.
            dataInvalida:
              summary: Data fora do formato AAAA-MM-DD
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: Valor inválido para o parâmetro 'from'.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/export
                details:
                  parameter: from
    PeriodoInvalido:
      description: Período fora de `TODAY`, `YESTERDAY` e `LAST_7_DAYS` (`VALIDATION_FAILED`), com o nome do parâmetro em `details`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            periodoInvalido:
              summary: Período que não existe
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: Valor inválido para o parâmetro 'period'.
                instance: /api/v1/sectors/3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11/dashboard
                details:
                  parameter: period
    SetorDoPainelNaoEncontrado:
      description: Setor inexistente, ou identificador malformado (`SECTOR_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            setorNaoEncontrado:
              summary: Identificador que não é de nenhum setor
              value:
                code: SECTOR_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Setor não encontrado.
                instance: /api/v1/sectors/galpao-9/dashboard
    FormatoIndisponivel:
      description: Formato de resposta indisponível (`REQUEST_NOT_ACCEPTABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequisicaoNaoSuportada:
      description: Corpo em formato diferente de JSON (`REQUEST_NOT_ACCEPTABLE`, 415).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ErroInesperado:
      description: Falha inesperada (`INTERNAL_ERROR`), sem detalhe da causa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SectorStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      description: Situação do setor; num setor inativo, os relatórios são só de consulta.
    ProductionStatus:
      type: string
      enum:
      - COMPLETE
      - PENDING
      description: '`COMPLETE` quando toda gaiola do relatório tem a produção lançada.'
    MortalityStatus:
      type: string
      enum:
      - RECORDED
      - PENDING
      description: '`RECORDED` quando há morte ou descarte lançado, ou a confirmação de dia sem ocorrência.'
    ReportingSector:
      type: object
      description: O setor do relatório, como a tela precisa dele
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
          example: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
        name:
          type: string
          example: Codornas — Galpão 4
        status:
          $ref: '#/components/schemas/SectorStatus'
    Actor:
      type: object
      description: Quem fez a operação, como estava na sessão naquele momento
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          example: 1e3a5c7b-9d1f-4b3d-8e5a-7c9e1a3b5d77
        name:
          type: string
          example: Marina Alves
    DailyReportRequest:
      type: object
      description: Abertura ou correção dos dados gerais do relatório. As quantidades podem vir como número ou como texto.
      required:
      - collectionDate
      - collectionTime
      - openingBirdCount
      - flockAge
      properties:
        collectionDate:
          type: string
          description: Data da coleta, `AAAA-MM-DD`; não futura no fuso da granja; única no setor
          example: '2026-09-25'
        collectionTime:
          type: string
          description: Hora da coleta, `HH:mm`
          example: 06:42
        openingBirdCount:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Aves no início do dia
          example: 96
        flockAge:
          type: integer
          minimum: 1
          maximum: 150
          description: Idade do lote, em semanas
          example: 20
        note:
          type: string
          maxLength: 500
          description: Algo fora do comum na coleta
          example: Temperatura alta no fim da tarde de ontem.
    DailyReportSuggestion:
      type: object
      description: Valores sugeridos para o formulário de relatório novo
      required:
      - collectionDate
      - collectionTime
      - openingBirdCount
      properties:
        collectionDate:
          type: string
          format: date
          description: Hoje, no fuso da granja
          example: '2026-09-25'
        collectionTime:
          type: string
          description: Agora, no fuso da granja, `HH:mm`
          example: 06:42
        openingBirdCount:
          type: integer
          description: Saldo do relatório mais recente do setor ou, no primeiro, a soma das aves das gaiolas ativas
          example: 96
        flockAge:
          type: integer
          description: Idade do relatório mais recente mais as semanas completas passadas; ausente no primeiro relatório
          example: 20
    DailyReportSummary:
      type: object
      description: Relatório na lista do setor
      required:
      - id
      - collectionDate
      - collectionTime
      - openedByName
      - flockAge
      - collectedEggs
      - removedBirds
      - closingBirdCount
      - productionStatus
      - pendingCages
      - mortalityStatus
      - feedStatus
      - feedPendingCages
      properties:
        id:
          type: string
          format: uuid
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        collectionDate:
          type: string
          format: date
          example: '2026-09-24'
        collectionTime:
          type: string
          example: 06:30
        openedByName:
          type: string
          description: Quem abriu o relatório
          example: Marina Alves
        flockAge:
          type: integer
          description: Idade do lote, em semanas
          example: 20
        collectedEggs:
          type: integer
          description: Ovos coletados em todas as gaiolas
          example: 89
        removedBirds:
          type: integer
          description: Mortes mais descartes do dia
          example: 2
        closingBirdCount:
          type: integer
          description: Saldo de aves, para o relatório seguinte
          example: 96
        note:
          type: string
          example: Bebedouro da bateria B trocado.
        productionStatus:
          $ref: '#/components/schemas/ProductionStatus'
        pendingCages:
          type: integer
          description: Gaiolas sem produção lançada
          example: 1
        mortalityStatus:
          $ref: '#/components/schemas/MortalityStatus'
        feedStatus:
          $ref: '#/components/schemas/FeedStatus'
        feedPendingCages:
          type: integer
          description: Gaiolas ainda sem ração
          example: 0
    DailyReportPage:
      type: object
      description: Uma página dos relatórios do setor, com o setor junto
      required:
      - sector
      - content
      - page
      - size
      - totalElements
      - totalPages
      properties:
        sector:
          $ref: '#/components/schemas/ReportingSector'
        content:
          type: array
          items:
            $ref: '#/components/schemas/DailyReportSummary'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
    ProductionTotals:
      type: object
      description: Totais de produção do dia e a situação do lançamento
      required:
      - status
      - pendingCages
      - collectedEggs
      - standardEggs
      - unsellableEggs
      - layingRate
      properties:
        status:
          $ref: '#/components/schemas/ProductionStatus'
        pendingCages:
          type: integer
          example: 1
        collectedEggs:
          type: integer
          example: 89
        standardEggs:
          type: integer
          description: Ovos coletados menos os classificados fora do padrão
          example: 79
        unsellableEggs:
          type: integer
          description: Trincados, com sangue e anormais
          example: 4
        layingRate:
          type: number
          description: Produtividade — ovos coletados ÷ aves do início do dia, em porcentagem, com duas casas
          example: 90.82
    MortalityTotals:
      type: object
      description: Totais de mortalidade do dia e a situação do lançamento
      required:
      - status
      - deaths
      - culls
      - removalRate
      - closingBirdCount
      properties:
        status:
          $ref: '#/components/schemas/MortalityStatus'
        deaths:
          type: integer
          example: 1
        culls:
          type: integer
          example: 1
        removalRate:
          type: number
          description: Taxa do dia — (mortes + descartes) ÷ aves do início do dia, em porcentagem, com duas casas
          example: 2.04
        closingBirdCount:
          type: integer
          description: Saldo de aves — aves do início do dia menos mortes e descartes
          example: 96
    Production:
      type: object
      description: Produção lançada numa gaiola
      required:
      - eggs
      - small
      - jumbo
      - dirty
      - cracked
      - bloodSpot
      - abnormal
      properties:
        eggs:
          type: integer
          description: Ovos coletados
          example: 45
        small:
          type: integer
          description: Pequenos
          example: 1
        jumbo:
          type: integer
          description: Jumbo
          example: 1
        dirty:
          type: integer
          description: Sujos
          example: 1
        cracked:
          type: integer
          description: Trincados
          example: 2
        bloodSpot:
          type: integer
          description: Com sangue
          example: 1
        abnormal:
          type: integer
          description: Anormais
          example: 1
    Mortality:
      type: object
      description: Mortalidade lançada numa gaiola
      required:
      - deaths
      - culls
      properties:
        deaths:
          type: integer
          description: Aves encontradas mortas
          example: 1
        culls:
          type: integer
          description: Aves descartadas — retiradas do plantel
          example: 1
        note:
          type: string
          example: Prostração e penas eriçadas; uma ave separada para necropsia.
    ReportCageDetail:
      type: object
      description: Uma gaiola do relatório, como estava na abertura, com os lançamentos que tiver
      required:
      - cageId
      - code
      - battery
      - number
      - birdCount
      properties:
        cageId:
          type: string
          format: uuid
          example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
        code:
          type: string
          example: B-07
        battery:
          type: string
          example: B
        number:
          type: integer
          example: 7
        birdCount:
          type: integer
          description: Aves da gaiola na abertura do relatório
          example: 50
        production:
          $ref: '#/components/schemas/Production'
        mortality:
          $ref: '#/components/schemas/Mortality'
        feed:
          $ref: '#/components/schemas/CageFeed'
    DailyReportDetail:
      type: object
      description: O relatório com as gaiolas, os lançamentos e os totais do dia, de produção, de ração e de mortalidade
      required:
      - id
      - sector
      - collectionDate
      - collectionTime
      - openingBirdCount
      - flockAge
      - noMortalityConfirmed
      - openedBy
      - openedAt
      - production
      - mortality
      - feed
      - cages
      properties:
        id:
          type: string
          format: uuid
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        sector:
          $ref: '#/components/schemas/ReportingSector'
        collectionDate:
          type: string
          format: date
          example: '2026-09-24'
        collectionTime:
          type: string
          example: 06:30
        openingBirdCount:
          type: integer
          description: Aves no início do dia
          example: 98
        flockAge:
          type: integer
          description: Idade do lote, em semanas
          example: 20
        note:
          type: string
          example: Bebedouro da bateria B trocado.
        noMortalityConfirmed:
          type: boolean
          description: Verdadeiro depois da confirmação de dia sem ocorrência
          example: true
        openedBy:
          $ref: '#/components/schemas/Actor'
        openedAt:
          type: string
          format: date-time
          example: '2026-09-24T09:31:40Z'
        lastCorrectedBy:
          $ref: '#/components/schemas/Actor'
        lastCorrectedAt:
          type: string
          format: date-time
          example: '2026-09-24T11:05:12Z'
        production:
          $ref: '#/components/schemas/ProductionTotals'
        mortality:
          $ref: '#/components/schemas/MortalityTotals'
        cages:
          type: array
          description: As gaiolas do relatório, por bateria e número
          items:
            $ref: '#/components/schemas/ReportCageDetail'
        feed:
          $ref: '#/components/schemas/FeedTotals'
    ProductionRequest:
      type: object
      description: Lançamento ou correção da produção de uma gaiola. As quantidades podem vir como número ou como texto; classificação em branco vale zero.
      required:
      - eggs
      properties:
        eggs:
          type: integer
          minimum: 0
          maximum: 1000
          description: Ovos coletados
          example: 45
        small:
          type: integer
          minimum: 0
          maximum: 1000
          description: Pequenos
          example: 1
        jumbo:
          type: integer
          minimum: 0
          maximum: 1000
          description: Jumbo
          example: 1
        dirty:
          type: integer
          minimum: 0
          maximum: 1000
          description: Sujos
          example: 1
        cracked:
          type: integer
          minimum: 0
          maximum: 1000
          description: Trincados
          example: 2
        bloodSpot:
          type: integer
          minimum: 0
          maximum: 1000
          description: Com sangue
          example: 1
        abnormal:
          type: integer
          minimum: 0
          maximum: 1000
          description: Anormais
          example: 1
    MortalityRequest:
      type: object
      description: Lançamento ou correção da mortalidade de uma gaiola. Em branco vale zero.
      properties:
        deaths:
          type: integer
          minimum: 0
          maximum: 1000
          description: Aves encontradas mortas
          example: 1
        culls:
          type: integer
          minimum: 0
          maximum: 1000
          description: Aves descartadas — retiradas do plantel
          example: 1
        note:
          type: string
          maxLength: 500
          description: Causa provável, sintomas, destino das aves
          example: Prostração e penas eriçadas; uma ave separada para necropsia.
    Problem:
      type: object
      description: RFC 9457 Problem Details, com a extensão `code` do erro de aplicação. Igual ao da API de Identidade.
      required:
      - code
      - title
      - status
      properties:
        code:
          type: string
          example: DAILY_REPORT_ALREADY_EXISTS
        title:
          type: string
          example: Operação recusada
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Já existe o relatório de 24/09/2026 neste setor.
        instance:
          type: string
          example: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
        details:
          type: object
          additionalProperties:
            type: string
          example:
            collectionDate: Já existe o relatório de 24/09/2026 neste setor.
    FeedStatus:
      type: string
      enum:
      - COMPLETE
      - PENDING
      description: '`COMPLETE` quando toda gaiola tem a ração lançada; `PENDING` enquanto falta alguma.'
    CageFeed:
      type: object
      description: Ração lançada numa gaiola, com o preço e o esperado guardados no lançamento
      required:
      - formulaId
      - formulaName
      - pricePerKg
      - expectedIntake
      - consumption
      - cost
      properties:
        formulaId:
          type: string
          format: uuid
          example: 4e6a8c0e-2a4c-4e6a-9c0e-2a4c6e8a0c11
        formulaName:
          type: string
          description: Nome atual da fórmula
          example: Postura Plus
        pricePerKg:
          type: number
          description: Preço por quilo guardado no lançamento, em reais
          example: 2.85
        expectedIntake:
          type: integer
          description: Consumo esperado por ave ao dia guardado no lançamento, em gramas
          example: 28
        consumption:
          type: integer
          description: Consumo da gaiola no dia, em gramas
          example: 1400
        cost:
          type: number
          description: Consumo ÷ 1.000 × preço, em reais, com duas casas
          example: 3.99
        intakePerBird:
          type: number
          description: Consumo ÷ aves da gaiola, em gramas, com uma casa; ausente com 0 aves
          example: 28.0
        deviation:
          type: number
          description: Desvio do consumo por ave em relação ao esperado, em porcentagem, com uma casa; ausente com 0 aves
          example: 0.0
    FeedTotals:
      type: object
      description: Totais de ração do dia, das gaiolas com ração lançada
      required:
      - status
      - pendingCages
      - consumption
      - cost
      properties:
        status:
          $ref: '#/components/schemas/FeedStatus'
        pendingCages:
          type: integer
          description: Gaiolas ainda sem ração
          example: 0
        consumption:
          type: integer
          description: Consumo total, em gramas
          example: 2744
        cost:
          type: number
          description: Custo da ração, em reais, com duas casas
          example: 7.82
        costPerEgg:
          type: number
          description: Custo da ração ÷ ovos coletados, em reais, com três casas; ausente sem ovo ou sem ração lançada
          example: 0.088
        intakePerBird:
          type: number
          description: Consumo total ÷ aves das gaiolas lançadas, em gramas, com uma casa; ausente sem aves
          example: 28.0
        expectedIntakePerBird:
          type: number
          description: Esperado de cada fórmula pesado pelas aves das gaiolas lançadas, em gramas, com uma casa; ausente sem aves
          example: 28.0
    FeedRequest:
      type: object
      description: Lançamento ou correção da ração de uma gaiola. O consumo pode vir como número ou como texto.
      required:
      - formulaId
      - consumption
      properties:
        formulaId:
          type: string
          format: uuid
          description: Fórmula ativa, ou a que a gaiola já usa
          example: 4e6a8c0e-2a4c-4e6a-9c0e-2a4c6e8a0c11
        consumption:
          type: integer
          minimum: 0
          maximum: 50000
          description: Consumo da gaiola no dia, em gramas
          example: 1250
    FeedSuggestionRequest:
      type: object
      description: 'Lançamento da ração do setor pela sugestão: as gaiolas sem ração recebem o consumo esperado da fórmula'
      required:
      - formulaId
      properties:
        formulaId:
          type: string
          format: uuid
          description: Fórmula ativa
          example: 4e6a8c0e-2a4c-4e6a-9c0e-2a4c6e8a0c11
    SuggestedCageFeed:
      type: object
      description: Proposta para uma gaiola sem ração
      required:
      - cageId
      - code
      - birdCount
      - consumption
      - cost
      properties:
        cageId:
          type: string
          format: uuid
          example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
        code:
          type: string
          example: B-07
        birdCount:
          type: integer
          example: 50
        consumption:
          type: integer
          description: Aves × consumo esperado, em gramas
          example: 1400
        cost:
          type: number
          description: Em reais, com duas casas
          example: 3.99
    FeedSuggestion:
      type: object
      description: 'O que o lançamento pela sugestão gravaria: a proposta de cada gaiola sem ração e os totais do dia com ela'
      required:
      - formula
      - cages
      - totals
      properties:
        formula:
          type: object
          required:
          - id
          - name
          - pricePerKg
          - expectedIntake
          properties:
            id:
              type: string
              format: uuid
              example: 4e6a8c0e-2a4c-4e6a-9c0e-2a4c6e8a0c11
            name:
              type: string
              example: Postura Plus
            pricePerKg:
              type: number
              example: 2.85
            expectedIntake:
              type: integer
              example: 28
        cages:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedCageFeed'
        totals:
          $ref: '#/components/schemas/FeedTotals'
    DashboardPeriod:
      type: string
      enum:
      - TODAY
      - YESTERDAY
      - LAST_7_DAYS
      description: '`TODAY` compara hoje com ontem; `YESTERDAY`, ontem com anteontem; `LAST_7_DAYS`, os 7 dias até hoje com os 7 anteriores.'
    DashboardSector:
      type: object
      description: Uma aba do painel
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          example: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
        name:
          type: string
          example: Codornas — Galpão 1
    DashboardOverview:
      type: object
      description: O cabeçalho do painel e as abas
      required:
      - today
      - partOfDay
      - activeSectors
      - completeToday
      - sectors
      properties:
        today:
          type: string
          format: date
          description: O dia de hoje da granja, no fuso dela
          example: '2026-09-24'
        partOfDay:
          type: string
          enum:
          - MORNING
          - AFTERNOON
          - EVENING
          description: A parte do dia no relógio da granja, para a saudação
          example: MORNING
        activeSectors:
          type: integer
          description: Quantos setores ativos existem
          example: 3
        completeToday:
          type: integer
          description: Quantos setores ativos têm o relatório de hoje com a produção, a ração e a mortalidade lançadas
          example: 2
        sectors:
          type: array
          description: Os setores ativos com ao menos um relatório, por nome
          items:
            $ref: '#/components/schemas/DashboardSector'
    TodayReport:
      type: object
      description: O relatório de hoje do setor e a situação de cada lançamento
      required:
      - id
      - productionStatus
      - feedStatus
      - mortalityStatus
      properties:
        id:
          type: string
          format: uuid
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        productionStatus:
          $ref: '#/components/schemas/ProductionStatus'
        feedStatus:
          $ref: '#/components/schemas/FeedStatus'
        mortalityStatus:
          $ref: '#/components/schemas/MortalityStatus'
    Indicator:
      type: object
      description: Um indicador do período, comparado com o período anterior. Sem dado, o valor fica ausente, e não zero.
      required:
      - goodDirection
      - incompleteDays
      properties:
        value:
          type: number
          description: O valor do período
          example: 1740
        previous:
          type: number
          description: O valor do período anterior
          example: 1700
        change:
          type: number
          description: A variação sobre o anterior, em porcentagem com uma casa (produção e custos) ou em pontos percentuais com duas casas (produtividade). Ausente sem os dois valores, ou com o anterior zero.
          example: 2.4
        goodDirection:
          type: string
          enum:
          - UP
          - DOWN
          description: O sentido bom da variação
          example: UP
        incompleteDays:
          type: integer
          description: Os dias do período com o lançamento pendente (a produção, na produção e na produtividade; a ração, nos custos)
          example: 0
    Indicators:
      type: object
      description: Os quatro indicadores do painel
      required:
      - production
      - layingRate
      - feedCost
      - costPerEgg
      properties:
        production:
          $ref: '#/components/schemas/Indicator'
        layingRate:
          $ref: '#/components/schemas/Indicator'
        feedCost:
          $ref: '#/components/schemas/Indicator'
        costPerEgg:
          $ref: '#/components/schemas/Indicator'
    DashboardDay:
      type: object
      description: Um dia da série dos últimos 7 dias. Sem relatório, os valores ficam ausentes; com a ração pendente, os custos ficam ausentes.
      required:
      - date
      properties:
        date:
          type: string
          format: date
          example: '2026-09-24'
        production:
          type: integer
          description: Ovos coletados
          example: 1740
        layingRate:
          type: number
          description: Produtividade, em porcentagem com duas casas
          example: 87.00
        feedCost:
          type: number
          description: Custo da ração, em reais com duas casas
          example: 159.60
        costPerEgg:
          type: number
          description: Custo por ovo, em reais com três casas
          example: 0.092
    EggGradeShare:
      type: object
      description: Uma classe de ovos, com a quantidade e a porcentagem sobre os coletados
      required:
      - grade
      - count
      - percent
      properties:
        grade:
          type: string
          enum:
          - standard
          - small
          - jumbo
          - dirty
          - cracked
          - bloodSpot
          - abnormal
          example: cracked
        count:
          type: integer
          example: 18
        percent:
          type: number
          description: A quantidade sobre os coletados, com uma casa
          example: 1.0
    EggGrading:
      type: object
      description: A classificação dos ovos do período
      required:
      - collected
      - standard
      - shares
      properties:
        collected:
          type: integer
          example: 1740
        standard:
          $ref: '#/components/schemas/EggGradeShare'
        shares:
          type: array
          description: As seis classes fora do padrão, nesta ordem
          items:
            $ref: '#/components/schemas/EggGradeShare'
    AlertTarget:
      type: object
      description: Para onde o alerta leva. Sem campo, é a abertura do relatório de hoje.
      properties:
        reportId:
          type: string
          format: uuid
          description: O relatório de hoje, quando existe
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        cageId:
          type: string
          format: uuid
          description: A gaiola, nos alertas de gaiola
          example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
        cageCode:
          type: string
          example: B-07
    DashboardAlert:
      type: object
      description: Um alerta ou uma pendência de hoje, com o que aconteceu e para onde leva
      required:
      - kind
      - tone
      - title
      - detail
      - target
      properties:
        kind:
          type: string
          enum:
          - REPORT_NOT_OPENED
          - PRODUCTION_PENDING
          - FEED_PENDING
          - MORTALITY_PENDING
          - HIGH_MORTALITY
          - LOW_LAYING
          - WEIGHT_OUT_OF_RANGE
          example: HIGH_MORTALITY
        tone:
          type: string
          enum:
          - WARNING
          - INFO
          example: WARNING
        title:
          type: string
          example: Mortalidade acima da média na gaiola B-07
        detail:
          type: string
          example: 2 aves removidas hoje; a média do setor é 0,4 por gaiola ao dia.
        target:
          $ref: '#/components/schemas/AlertTarget'
    LatestReport:
      type: object
      description: Um dos relatórios mais recentes do setor
      required:
      - id
      - collectionDate
      - collectionTime
      - openedBy
      - collectedEggs
      - removedBirds
      - productionStatus
      - feedStatus
      - mortalityStatus
      properties:
        id:
          type: string
          format: uuid
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        collectionDate:
          type: string
          format: date
          example: '2026-09-24'
        collectionTime:
          type: string
          pattern: ^\d{2}:\d{2}$
          example: 06:30
        openedBy:
          $ref: '#/components/schemas/Actor'
        collectedEggs:
          type: integer
          example: 1740
        removedBirds:
          type: integer
          example: 3
        productionStatus:
          $ref: '#/components/schemas/ProductionStatus'
        feedStatus:
          $ref: '#/components/schemas/FeedStatus'
        mortalityStatus:
          $ref: '#/components/schemas/MortalityStatus'
    SectorDashboard:
      type: object
      description: O painel de um setor num período
      required:
      - sector
      - period
      - from
      - to
      - indicators
      - trend
      - target
      - alerts
      - openAlerts
      - latestReports
      properties:
        sector:
          $ref: '#/components/schemas/ReportingSector'
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        from:
          type: string
          format: date
          description: O primeiro dia do período
          example: '2026-09-18'
        to:
          type: string
          format: date
          description: O último dia do período
          example: '2026-09-24'
        todayReport:
          $ref: '#/components/schemas/TodayReport'
        indicators:
          $ref: '#/components/schemas/Indicators'
        trend:
          type: array
          description: Os 7 dias de hoje − 6 até hoje, para as tendências e os gráficos
          items:
            $ref: '#/components/schemas/DashboardDay'
        target:
          type: number
          description: >-
            A meta de produtividade do setor, em porcentagem, com duas casas como a produtividade. A
            produtividade igual à meta conta como acima.
          example: 85.00
        targetStatus:
          type: string
          enum:
          - ABOVE
          - BELOW
          description: O último dia com relatório diante da meta; ausente sem dia com relatório
          example: ABOVE
        grades:
          $ref: '#/components/schemas/EggGrading'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAlert'
        openAlerts:
          type: integer
          example: 3
        latestReports:
          type: array
          description: Os 4 relatórios mais recentes, do mais novo para o mais antigo
          items:
            $ref: '#/components/schemas/LatestReport'
security:
- sessionCookie: []
