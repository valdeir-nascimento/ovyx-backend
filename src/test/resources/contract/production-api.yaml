  /api/v1/sectors/{sectorId}/daily-reports/export:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags:
      - Relatórios diários
      summary: Exportar os relatórios de um intervalo para planilha
      description: 'Os relatórios do setor com a data de coleta entre `from` e `to`, inclusive, como planilha do Excel. A aba "Relatórios" tem uma linha por relatório, do mais antigo para o mais novo, e a linha de totais do intervalo; a aba "Gaiolas", uma linha por gaiola de cada relatório. Sem relatório no intervalo, a planilha sai com o cabeçalho e o aviso. Setor inativo continua exportável. O arquivo se chama `relatorios-<setor>-<de>-a-<ate>.xlsx`.'
      operationId: exportDailyReports
      parameters:
      - name: from
        in: query
        required: true
        description: O primeiro dia de coleta do intervalo, inclusive.
        schema:
          type: string
          format: date
        example: '2026-09-01'
      - name: to
        in: query
        required: true
        description: O último dia de coleta do intervalo, inclusive. O intervalo tem no máximo 366 dias.
        schema:
          type: string
          format: date
        example: '2026-09-28'
      responses:
        '200':
          description: Planilha dos relatórios do intervalo
          headers:
            Content-Disposition:
              description: O nome do arquivo, para salvar. O nome do setor sai simplificado, sem acento e com hífens.
              schema:
                type: string
              example: attachment; filename="relatorios-codornas-galpao-1-01-09-2026-a-28-09-2026.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/IntervaloInvalido'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
