        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    post:
      tags:
      - Relatórios diários
      summary: Abrir relatório do dia
      description: Abre o relatório de um dia de coleta do setor. As gaiolas ativas do setor entram no relatório como estão agora, sem lançamento.
      operationId: openDailyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReportRequest'
            examples:
              relatorioDeHoje:
                summary: Coleta da manhã
                value:
                  collectionDate: '2026-09-25'
                  collectionTime: 06:42
                  openingBirdCount: 96
                  flockAge: 20
                  note: Temperatura alta no fim da tarde de ontem.
      responses:
        '201':
          description: Relatório aberto. O cabeçalho `Location` aponta para ele.
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/8e2a4c6e-0a2c-4e6a-8c0e-2a4c6e8a0c99
