  /api/v1/sectors/{sectorId}/daily-reports/{reportId}/cages/{cageId}:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    - $ref: '#/components/parameters/ReportId'
    - $ref: '#/components/parameters/CageId'
    get:
      tags: [Relatórios diários]
      summary: Consultar gaiola do relatório
      description: Uma gaiola do relatório, como estava na abertura, com a produção e a mortalidade lançadas.
      operationId: findReportCage
      responses:
        '200':
          description: Gaiola do relatório
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCageDetail'
              examples:
                gaiolaComOcorrencia:
                  summary: Gaiola com produção e mortalidade lançadas
                  value:
                    cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                    code: B-07
                    battery: B
                    number: 7
                    birdCount: 50
                    production:
                      eggs: 45
                      small: 0
                      jumbo: 1
                      dirty: 1
                      cracked: 2
                      bloodSpot: 1
                      abnormal: 0
                    mortality:
                      deaths: 1
                      culls: 1
                      note: Prostração e penas eriçadas; uma ave separada para necropsia.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/GaiolaDoRelatorioNaoEncontrada'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/daily-reports/{reportId}/cages/{cageId}/production:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    - $ref: '#/components/parameters/ReportId'
    - $ref: '#/components/parameters/CageId'
    put:
      tags: [Relatórios diários]
      summary: Lançar produção da gaiola
      description: Lança ou corrige os ovos coletados na gaiola e a classificação dos que saíram fora do padrão. Classificação em branco vale zero.
      operationId: recordProduction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionRequest'
            examples:
              producaoDaGaiola:
                summary: 45 ovos, 5 fora do padrão; pequenos e anormais em branco valem zero
                value:
                  eggs: 45
                  jumbo: 1
                  dirty: 1
                  cracked: 2
                  bloodSpot: 1
      responses:
        '200':
          description: Produção gravada na gaiola do relatório
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCageDetail'
              examples:
                producaoLancada:
                  summary: Gaiola com a produção lançada
                  value:
                    cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                    code: B-07
                    battery: B
                    number: 7
                    birdCount: 50
                    production:
                      eggs: 45
                      small: 0
                      jumbo: 1
                      dirty: 1
                      cracked: 2
                      bloodSpot: 1
                      abnormal: 0
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), inclusive classificações acima dos ovos coletados, ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                classificacaoAcimaDosOvos:
                  summary: Classificações somando mais que os ovos coletados
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44/production
                    details:
                      eggs: As classificações somam 34, mais que os 30 ovos coletados.
                camposInvalidos:
                  summary: Ovos em branco e trincados que não são inteiros
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44/production
                    details:
                      eggs: Informe os ovos coletados.
                      cracked: A quantidade de trincados deve ser um número inteiro.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/EscritaSemProtecao'
        '404':
          $ref: '#/components/responses/GaiolaDoRelatorioNaoEncontrada'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          $ref: '#/components/responses/SetorInativo'
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/daily-reports/{reportId}/cages/{cageId}/mortality:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    - $ref: '#/components/parameters/ReportId'
    - $ref: '#/components/parameters/CageId'
    put:
      tags: [Relatórios diários]
      summary: Lançar mortalidade da gaiola
      description: Lança ou corrige as mortes e os descartes da gaiola, com uma observação. Em branco vale zero. As aves da gaiola no cadastro não mudam.
      operationId: recordMortality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MortalityRequest'
            examples:
              mortalidadeDaGaiola:
                summary: Uma morte e um descarte
                value:
                  deaths: 1
                  culls: 1
                  note: Prostração e penas eriçadas; uma ave separada para necropsia.
      responses:
        '200':
          description: Mortalidade gravada na gaiola do relatório
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCageDetail'
              examples:
                mortalidadeLancada:
                  summary: Gaiola com a mortalidade lançada
                  value:
                    cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                    code: B-07
                    battery: B
                    number: 7
                    birdCount: 50
                    production:
                      eggs: 45
                      small: 0
                      jumbo: 1
                      dirty: 1
                      cracked: 2
                      bloodSpot: 1
                      abnormal: 0
                    mortality:
                      deaths: 1
                      culls: 1
                      note: Prostração e penas eriçadas; uma ave separada para necropsia.
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), inclusive mortes e descartes acima das aves da gaiola ou das do início do dia, ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                acimaDasAvesDaGaiola:
                  summary: Mortes e descartes acima das aves da gaiola
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44/mortality
                    details:
                      deaths: A gaiola tem 50 aves; mortes e descartes somam 55.
                camposInvalidos:
                  summary: Mortes negativas e descartes que não são inteiros
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44/mortality
                    details:
                      deaths: As mortes devem ficar entre 0 e 1.000.
                      culls: Os descartes devem ser um número inteiro.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/EscritaSemProtecao'
        '404':
          $ref: '#/components/responses/GaiolaDoRelatorioNaoEncontrada'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          $ref: '#/components/responses/SetorInativo'
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/daily-reports/{reportId}/mortality-confirmation:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    - $ref: '#/components/parameters/ReportId'
    post:
      tags: [Relatórios diários]
      summary: Confirmar dia sem ocorrência
      description: Registra que o dia não teve mortes nem descartes no setor, sem lançamento por gaiola. Só vale sem ocorrência lançada; confirmar de novo não muda nada.
      operationId: confirmNoMortality
      responses:
        '200':
          description: Mortalidade do relatório confirmada sem ocorrência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportDetail'
              examples:
                diaSemOcorrencia:
                  summary: Mortalidade lançada pela confirmação
                  value:
                    id: 4f6b8d0f-2b4d-4f6b-9d1f-3b5d7f9b1d11
                    sector:
                      id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                      name: Codornas — Galpão 4
                      status: ACTIVE
                    collectionDate: '2026-09-23'
                    collectionTime: '06:35'
                    openingBirdCount: 98
                    flockAge: 20
                    noMortalityConfirmed: true
                    openedBy:
                      id: 5d7f9b1d-3f5a-4c7e-9a1b-3d5f7a9c1e88
                      name: João Pereira
                    openedAt: '2026-09-23T09:36:18Z'
                    lastCorrectedBy:
                      id: 5d7f9b1d-3f5a-4c7e-9a1b-3d5f7a9c1e88
                      name: João Pereira
                    lastCorrectedAt: '2026-09-23T10:02:44Z'
                    production:
                      status: COMPLETE
                      pendingCages: 0
                      collectedEggs: 91
                      standardEggs: 84
                      unsellableEggs: 3
                      layingRate: 92.86
                    mortality:
                      status: RECORDED
                      deaths: 0
                      culls: 0
                      removalRate: 0.00
                      closingBirdCount: 98
                    cages:
                    - cageId: 2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66
                      code: A-01
                      battery: A
                      number: 1
                      birdCount: 48
                      production:
                        eggs: 45
                        small: 1
                        jumbo: 1
                        dirty: 1
                        cracked: 1
                        bloodSpot: 0
                        abnormal: 0
                    - cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                      code: B-07
                      battery: B
                      number: 7
                      birdCount: 50
                      production:
                        eggs: 46
                        small: 0
                        jumbo: 1
                        dirty: 0
                        cracked: 1
                        bloodSpot: 1
                        abnormal: 0
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/EscritaSemProtecao'
        '404':
          $ref: '#/components/responses/RelatorioNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: O relatório já tem ocorrência lançada (`MORTALITY_ALREADY_RECORDED`), ou o setor está inativo (`SECTOR_INACTIVE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ocorrenciaJaLancada:
                  summary: Confirmação com uma morte lançada
                  value:
                    code: MORTALITY_ALREADY_RECORDED
                    title: Operação recusada
                    status: 409
                    detail: O relatório já tem mortes ou descartes lançados.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/mortality-confirmation
        '500':
          $ref: '#/components/responses/ErroInesperado'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de sessão emitido no login. `HttpOnly` e `SameSite=Lax`; `Secure` fora do perfil de desenvolvimento, que usa http.
  parameters:
    SectorId:
      name: sectorId
      in: path
      required: true
      description: Identificador do setor.
      schema:
        type: string
        format: uuid
      example: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
    ReportId:
      name: reportId
      in: path
      required: true
      description: Identificador do relatório diário.
      schema:
        type: string
        format: uuid
      example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
    CageId:
      name: cageId
      in: path
      required: true
      description: Identificador da gaiola, o mesmo do cadastro de gaiolas.
      schema:
        type: string
        format: uuid
      example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
  responses:
    SessaoInvalida:
      description: Sem sessão válida (`UNAUTHENTICATED`), ou responsável inativado com a sessão aberta (`CARETAKER_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semSessao:
              summary: Sem sessão
              value:
                code: UNAUTHENTICATED
                title: Não autenticado
                status: 401
                detail: Sua sessão expirou. Entre novamente para continuar.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
    TrocaDeSenhaPendente:
      description: Troca de senha pendente (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            trocaDeSenhaPendente:
              summary: Senha provisória ainda não trocada
              value:
                code: PASSWORD_CHANGE_REQUIRED
                title: Troca de senha obrigatória
                status: 403
                detail: É necessário trocar a senha antes de executar qualquer outra operação.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
    EscritaSemProtecao:
      description: Escrita sem o token de proteção (`CSRF_TOKEN_INVALID`) ou com a troca de senha pendente (`PASSWORD_CHANGE_REQUIRED`). Qualquer perfil escreve; não há 403 de perfil.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tokenCsrfAusente:
              summary: Escrita sem o cabeçalho X-XSRF-TOKEN
              value:
                code: CSRF_TOKEN_INVALID
                title: Proteção da requisição ausente
                status: 403
                detail: O token de proteção da requisição está ausente ou expirou. Recarregue a página e tente novamente.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
            trocaDeSenhaPendente:
              summary: Senha provisória ainda não trocada
              value:
                code: PASSWORD_CHANGE_REQUIRED
                title: Troca de senha obrigatória
                status: 403
                detail: É necessário trocar a senha antes de executar qualquer outra operação.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
    SetorNaoEncontrado:
      description: Setor inexistente, ou identificador malformado (`SECTOR_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            setorNaoEncontrado:
              summary: Identificador que não é de nenhum setor
              value:
                code: SECTOR_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Setor não encontrado.
                instance: /api/v1/sectors/galpao-9/daily-reports
    RelatorioNaoEncontrado:
      description: Setor ou relatório inexistente, relatório de outro setor, ou identificador malformado (`SECTOR_NOT_FOUND` ou `DAILY_REPORT_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            relatorioNaoEncontrado:
              summary: Relatório que não é deste setor
              value:
                code: DAILY_REPORT_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Relatório não encontrado.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/24-09
    GaiolaDoRelatorioNaoEncontrada:
      description: Setor, relatório ou gaiola inexistente, gaiola que não está no relatório, ou identificador malformado (`SECTOR_NOT_FOUND`, `DAILY_REPORT_NOT_FOUND` ou `CAGE_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gaiolaForaDoRelatorio:
              summary: Gaiola cadastrada depois da abertura do relatório
              value:
                code: CAGE_NOT_FOUND
                title: Não encontrado
                status: 404
                detail: Gaiola não encontrada neste relatório.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/3b5d7f9b-1d3f-4b5d-8f9b-1d3f5b7d9f00
    SetorInativo:
      description: Lançamento num relatório de setor inativo (`SECTOR_INACTIVE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            setorInativo:
              summary: Setor inativado depois da abertura do relatório
              value:
                code: SECTOR_INACTIVE
                title: Operação recusada
                status: 409
                detail: O setor está inativo; os relatórios dele são só para consulta.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55/cages/9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44/production
    FiltroInvalido:
      description: Página fora do permitido ou data em formato inválido (`VALIDATION_FAILED`). Data inválida traz o nome do parâmetro em `details`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            paginaInvalida:
              summary: Tamanho de página acima de 100
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: A requisição contém campos inválidos.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                details:
                  size: O tamanho da página deve estar entre 1 e 100.
            dataInvalida:
              summary: Data fora do formato AAAA-MM-DD
              value:
                code: VALIDATION_FAILED
                title: Dados inválidos
                status: 400
                detail: Valor inválido para o parâmetro 'collectionDate'.
                instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                details:
                  parameter: collectionDate
    FormatoIndisponivel:
      description: Formato de resposta indisponível (`REQUEST_NOT_ACCEPTABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequisicaoNaoSuportada:
      description: Corpo em formato diferente de JSON (`REQUEST_NOT_ACCEPTABLE`, 415).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ErroInesperado:
      description: Falha inesperada (`INTERNAL_ERROR`), sem detalhe da causa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SectorStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: Situação do setor; num setor inativo, os relatórios são só de consulta.
    ProductionStatus:
      type: string
      enum: [COMPLETE, PENDING]
      description: '`COMPLETE` quando toda gaiola do relatório tem a produção lançada.'
    MortalityStatus:
      type: string
      enum: [RECORDED, PENDING]
      description: '`RECORDED` quando há morte ou descarte lançado, ou a confirmação de dia sem ocorrência.'
    ReportingSector:
      type: object
      description: O setor do relatório, como a tela precisa dele
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
          example: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
        name:
          type: string
          example: Codornas — Galpão 4
        status:
          $ref: '#/components/schemas/SectorStatus'
    Actor:
      type: object
      description: Quem fez a operação, como estava na sessão naquele momento
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          example: 1e3a5c7b-9d1f-4b3d-8e5a-7c9e1a3b5d77
        name:
          type: string
          example: Marina Alves
    DailyReportRequest:
      type: object
      description: Abertura ou correção dos dados gerais do relatório. As quantidades podem vir como número ou como texto.
      required: [collectionDate, collectionTime, openingBirdCount, flockAge]
      properties:
        collectionDate:
          type: string
          description: Data da coleta, `AAAA-MM-DD`; não futura no fuso da granja; única no setor
          example: '2026-09-25'
        collectionTime:
          type: string
          description: Hora da coleta, `HH:mm`
          example: '06:42'
        openingBirdCount:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Aves no início do dia
          example: 96
        flockAge:
          type: integer
          minimum: 1
          maximum: 150
          description: Idade do lote, em semanas
          example: 20
        note:
          type: string
          maxLength: 500
          description: Algo fora do comum na coleta
          example: Temperatura alta no fim da tarde de ontem.
    DailyReportSuggestion:
      type: object
      description: Valores sugeridos para o formulário de relatório novo
      required: [collectionDate, collectionTime, openingBirdCount]
      properties:
        collectionDate:
          type: string
          format: date
          description: Hoje, no fuso da granja
          example: '2026-09-25'
        collectionTime:
          type: string
          description: Agora, no fuso da granja, `HH:mm`
          example: '06:42'
        openingBirdCount:
          type: integer
          description: Saldo do relatório mais recente do setor ou, no primeiro, a soma das aves das gaiolas ativas
          example: 96
        flockAge:
          type: integer
          description: Idade do relatório mais recente mais as semanas completas passadas; ausente no primeiro relatório
          example: 20
    DailyReportSummary:
      type: object
      description: Relatório na lista do setor
      required: [id, collectionDate, collectionTime, openedByName, flockAge, collectedEggs, removedBirds, closingBirdCount, productionStatus, pendingCages, mortalityStatus]
      properties:
        id:
          type: string
          format: uuid
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        collectionDate:
          type: string
          format: date
          example: '2026-09-24'
        collectionTime:
          type: string
          example: '06:30'
        openedByName:
          type: string
          description: Quem abriu o relatório
          example: Marina Alves
        flockAge:
          type: integer
          description: Idade do lote, em semanas
          example: 20
        collectedEggs:
          type: integer
          description: Ovos coletados em todas as gaiolas
          example: 89
        removedBirds:
          type: integer
          description: Mortes mais descartes do dia
          example: 2
        closingBirdCount:
          type: integer
          description: Saldo de aves, para o relatório seguinte
          example: 96
        note:
          type: string
          example: Bebedouro da bateria B trocado.
        productionStatus:
          $ref: '#/components/schemas/ProductionStatus'
        pendingCages:
          type: integer
          description: Gaiolas sem produção lançada
          example: 1
        mortalityStatus:
          $ref: '#/components/schemas/MortalityStatus'
    DailyReportPage:
      type: object
      description: Uma página dos relatórios do setor, com o setor junto
      required: [sector, content, page, size, totalElements, totalPages]
      properties:
        sector:
          $ref: '#/components/schemas/ReportingSector'
        content:
          type: array
          items:
            $ref: '#/components/schemas/DailyReportSummary'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
    ProductionTotals:
      type: object
      description: Totais de produção do dia e a situação do lançamento
      required: [status, pendingCages, collectedEggs, standardEggs, unsellableEggs, layingRate]
      properties:
        status:
          $ref: '#/components/schemas/ProductionStatus'
        pendingCages:
          type: integer
          example: 1
        collectedEggs:
          type: integer
          example: 89
        standardEggs:
          type: integer
          description: Ovos coletados menos os classificados fora do padrão
          example: 79
        unsellableEggs:
          type: integer
          description: Trincados, com sangue e anormais
          example: 4
        layingRate:
          type: number
          description: Produtividade — ovos coletados ÷ aves do início do dia, em porcentagem, com duas casas
          example: 90.82
    MortalityTotals:
      type: object
      description: Totais de mortalidade do dia e a situação do lançamento
      required: [status, deaths, culls, removalRate, closingBirdCount]
      properties:
        status:
          $ref: '#/components/schemas/MortalityStatus'
        deaths:
          type: integer
          example: 1
        culls:
          type: integer
          example: 1
        removalRate:
          type: number
          description: Taxa do dia — (mortes + descartes) ÷ aves do início do dia, em porcentagem, com duas casas
          example: 2.04
        closingBirdCount:
          type: integer
          description: Saldo de aves — aves do início do dia menos mortes e descartes
          example: 96
    Production:
      type: object
      description: Produção lançada numa gaiola
      required: [eggs, small, jumbo, dirty, cracked, bloodSpot, abnormal]
      properties:
        eggs:
          type: integer
          description: Ovos coletados
          example: 45
        small:
          type: integer
          description: Pequenos
          example: 1
        jumbo:
          type: integer
          description: Jumbo
          example: 1
        dirty:
          type: integer
          description: Sujos
          example: 1
        cracked:
          type: integer
          description: Trincados
          example: 2
        bloodSpot:
          type: integer
          description: Com sangue
          example: 1
        abnormal:
          type: integer
          description: Anormais
          example: 1
    Mortality:
      type: object
      description: Mortalidade lançada numa gaiola
      required: [deaths, culls]
      properties:
        deaths:
          type: integer
          description: Aves encontradas mortas
          example: 1
        culls:
          type: integer
          description: Aves descartadas — retiradas do plantel
          example: 1
        note:
          type: string
          example: Prostração e penas eriçadas; uma ave separada para necropsia.
    ReportCageDetail:
      type: object
      description: Uma gaiola do relatório, como estava na abertura, com os lançamentos que tiver
      required: [cageId, code, battery, number, birdCount]
      properties:
        cageId:
          type: string
          format: uuid
          example: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
        code:
          type: string
          example: B-07
        battery:
          type: string
          example: B
        number:
          type: integer
          example: 7
        birdCount:
          type: integer
          description: Aves da gaiola na abertura do relatório
          example: 50
        production:
          $ref: '#/components/schemas/Production'
        mortality:
          $ref: '#/components/schemas/Mortality'
    DailyReportDetail:
      type: object
      description: O relatório com as gaiolas, os lançamentos e os totais do dia
      required: [id, sector, collectionDate, collectionTime, openingBirdCount, flockAge, noMortalityConfirmed, openedBy, openedAt, production, mortality, cages]
      properties:
        id:
          type: string
          format: uuid
          example: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
        sector:
          $ref: '#/components/schemas/ReportingSector'
        collectionDate:
          type: string
          format: date
          example: '2026-09-24'
        collectionTime:
          type: string
          example: '06:30'
        openingBirdCount:
          type: integer
          description: Aves no início do dia
          example: 98
        flockAge:
          type: integer
          description: Idade do lote, em semanas
          example: 20
        note:
          type: string
          example: Bebedouro da bateria B trocado.
        noMortalityConfirmed:
          type: boolean
          description: Verdadeiro depois da confirmação de dia sem ocorrência
          example: true
        openedBy:
          $ref: '#/components/schemas/Actor'
        openedAt:
          type: string
          format: date-time
          example: '2026-09-24T09:31:40Z'
        lastCorrectedBy:
          $ref: '#/components/schemas/Actor'
        lastCorrectedAt:
          type: string
          format: date-time
          example: '2026-09-24T11:05:12Z'
        production:
          $ref: '#/components/schemas/ProductionTotals'
        mortality:
          $ref: '#/components/schemas/MortalityTotals'
        cages:
          type: array
          description: As gaiolas do relatório, por bateria e número
          items:
            $ref: '#/components/schemas/ReportCageDetail'
    ProductionRequest:
      type: object
      description: Lançamento ou correção da produção de uma gaiola. As quantidades podem vir como número ou como texto; classificação em branco vale zero.
      required: [eggs]
      properties:
        eggs:
          type: integer
          minimum: 0
          maximum: 1000
          description: Ovos coletados
          example: 45
        small:
          type: integer
          minimum: 0
          maximum: 1000
          description: Pequenos
          example: 1
        jumbo:
          type: integer
          minimum: 0
          maximum: 1000
          description: Jumbo
          example: 1
        dirty:
          type: integer
          minimum: 0
          maximum: 1000
          description: Sujos
          example: 1
        cracked:
          type: integer
          minimum: 0
          maximum: 1000
          description: Trincados
          example: 2
        bloodSpot:
          type: integer
          minimum: 0
          maximum: 1000
          description: Com sangue
          example: 1
        abnormal:
          type: integer
          minimum: 0
          maximum: 1000
          description: Anormais
          example: 1
    MortalityRequest:
      type: object
      description: Lançamento ou correção da mortalidade de uma gaiola. Em branco vale zero.
      properties:
        deaths:
          type: integer
          minimum: 0
          maximum: 1000
          description: Aves encontradas mortas
          example: 1
        culls:
          type: integer
          minimum: 0
          maximum: 1000
          description: Aves descartadas — retiradas do plantel
          example: 1
        note:
          type: string
          maxLength: 500
          description: Causa provável, sintomas, destino das aves
          example: Prostração e penas eriçadas; uma ave separada para necropsia.
    Problem:
      type: object
      description: RFC 9457 Problem Details, com a extensão `code` do erro de aplicação. Igual ao da API de Identidade.
      required: [code, title, status]
      properties:
        code:
          type: string
          example: DAILY_REPORT_ALREADY_EXISTS
        title:
          type: string
          example: Operação recusada
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Já existe o relatório de 24/09/2026 neste setor.
        instance:
          type: string
          example: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
        details:
          type: object
          additionalProperties:
            type: string
          example:
            collectionDate: Já existe o relatório de 24/09/2026 neste setor.
security:
- sessionCookie: []
