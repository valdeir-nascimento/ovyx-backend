  /api/v1/sectors/{sectorId}/dashboard/export:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags:
      - Painel
      summary: Exportar o painel de um setor para planilha
      description: 'O painel do setor no período, como planilha do Excel: os quatro indicadores com o valor, o anterior e a variação; os 7 dias do gráfico; a classificação dos ovos; os alertas e as pendências abertos; e os 4 relatórios mais recentes. Os números são os da consulta do painel. O arquivo se chama `painel-<setor>-<data de hoje da granja>.xlsx`.'
      operationId: exportSectorDashboard
      parameters:
      - name: period
        in: query
        required: false
        description: O período do painel exportado. Sem ele, vale `TODAY`.
        schema:
          $ref: '#/components/schemas/DashboardPeriod'
        example: LAST_7_DAYS
      responses:
        '200':
          description: Planilha do painel
          headers:
            Content-Disposition:
              description: O nome do arquivo, para salvar. O nome do setor sai simplificado, sem acento e com hífens.
              schema:
                type: string
              example: attachment; filename="painel-codornas-galpao-1-28-09-2026.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/PeriodoInvalido'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorDoPainelNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/daily-reports:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags:
      - Relatórios diários
      summary: Listar relatórios do setor
      description: Relatórios do setor, do dia mais recente para o mais antigo, com o setor junto. O filtro por data traz o relatório daquele dia, se houver.
      operationId: listDailyReports
      parameters:
      - name: collectionDate
        in: query
        description: Data da coleta (`AAAA-MM-DD`); ausente, todos os relatórios do setor.
        schema:
          type: string
          format: date
        example: '2026-09-24'
      - name: page
        in: query
        description: Página, a partir de 0.
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: size
        in: query
        description: Tamanho da página, de 1 a 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Relatórios encontrados, possivelmente nenhum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportPage'
              examples:
                relatoriosDoSetor:
                  summary: Três dias do Galpão 4, o de hoje ainda pendente
                  value:
                    sector:
                      id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                      name: Codornas — Galpão 4
                      status: ACTIVE
