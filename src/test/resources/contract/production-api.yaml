                      name: Codornas — Galpão 4
                      status: ACTIVE
                    collectionDate: '2026-09-24'
                    collectionTime: '06:30'
                    openingBirdCount: 98
                    flockAge: 21
                    note: Bebedouro da bateria B trocado.
                    noMortalityConfirmed: false
                    openedBy:
                      id: 1e3a5c7b-9d1f-4b3d-8e5a-7c9e1a3b5d77
                      name: Marina Alves
                    openedAt: '2026-09-24T09:31:40Z'
                    lastCorrectedBy:
                      id: 5d7f9b1d-3f5a-4c7e-9a1b-3d5f7a9c1e88
                      name: João Pereira
                    lastCorrectedAt: '2026-09-25T10:12:08Z'
                    production:
                      status: COMPLETE
                      pendingCages: 0
                      collectedEggs: 89
                      standardEggs: 79
                      unsellableEggs: 4
                      layingRate: 90.82
                    mortality:
                      status: RECORDED
                      deaths: 1
                      culls: 1
                      removalRate: 2.04
                      closingBirdCount: 96
                    cages:
                    - cageId: 2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66
                      code: A-01
                      battery: A
                      number: 1
                      birdCount: 48
                      production:
                        eggs: 44
                        small: 1
                        jumbo: 2
                        dirty: 1
                        cracked: 1
                        bloodSpot: 0
                        abnormal: 0
                    - cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                      code: B-07
                      battery: B
                      number: 7
                      birdCount: 50
                      production:
                        eggs: 45
                        small: 0
                        jumbo: 1
                        dirty: 1
                        cracked: 2
                        bloodSpot: 1
                        abnormal: 0
                      mortality:
                        deaths: 1
                        culls: 1
                        note: Prostração e penas eriçadas; uma ave separada para necropsia.
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), inclusive aves do início do dia abaixo do que o relatório já removeu, ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                avesAbaixoDasRemovidas:
                  summary: Aves do início do dia abaixo das mortes e dos descartes já lançados
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
                    details:
                      openingBirdCount: O relatório já tem 2 aves removidas; as aves do início do dia não podem ficar abaixo disso.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/EscritaSemProtecao'
        '404':
          $ref: '#/components/responses/RelatorioNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
