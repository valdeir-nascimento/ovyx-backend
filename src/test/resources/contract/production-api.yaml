openapi: 3.1.0
info:
  title: Ovyx — API da Produção
  version: 1.0.0
  description: |
    Relatórios diários dos setores (`DailyReport`): a produção, a ração e a mortalidade lançadas por
    gaiola, um relatório por setor e por dia de coleta. E o painel do Início (`Dashboard`): os
    indicadores consolidados de um setor num período, os gráficos dos últimos 7 dias, a classificação
    dos ovos, os alertas e as pendências de hoje e os últimos relatórios.

    **Sessão, erros e CSRF**: iguais aos da API de Identidade
    (`specs/001-auth-foundation/contracts/identity-api.yaml`). Toda operação exige o cookie de
    sessão; toda escrita exige o cabeçalho `X-XSRF-TOKEN`; toda recusa segue RFC 9457 com a extensão
    `code`, e a de validação traz **todas** as violações de uma vez em `details`.

    **Perfis**: qualquer responsável autenticado — usuário comum ou administrador — abre, corrige,
    lança e consulta relatórios. Quem abriu e quem fez a última correção ficam registrados pela sessão.

    **Setor inativo**: os relatórios dele continuam consultáveis, e toda escrita é recusada com
    `SECTOR_INACTIVE`. **Nada é apagado**: não há exclusão de relatório nem de lançamento.

    **Quantidades**: inteiras. Como na API da Granja, também são aceitas como texto — o que o
    formulário digitou —, e o que não é inteiro é recusado no próprio campo, junto das demais falhas.
    Nos lançamentos, a classificação e a mortalidade em branco valem zero.

    **Ração**: cada lançamento guarda o preço por quilo e o consumo esperado da fórmula no momento em
    que foi feito; mudar a fórmula depois não muda o custo dos lançamentos já feitos. A fórmula de um
    lançamento novo precisa estar ativa (API das Fórmulas de Ração).

    **Painel**: só leitura, o mesmo para os dois perfis. "Hoje" é o dia da granja, no fuso dela. Os
    números são os mesmos dos relatórios; o custo considera só os dias com a ração completa, e o dia
    sem relatório fica sem valor, e não com zero. A meta de produtividade é a do setor (API da Granja,
    feature 008), a atual, também para os dias passados.

    **Planilhas**: o painel de um setor e os relatórios de um intervalo também saem como planilha do
    Excel (.xlsx), com os mesmos números da tela. Quantidades, valores em reais, porcentagens e datas
    são números e datas na planilha, e não texto; o valor sem dados fica em branco. Texto digitado por
    alguém sai sempre como texto, nunca como fórmula. A recusa de uma exportação é a mesma de qualquer
    operação: `application/problem+json`, e não uma planilha.
servers:
- url: http://localhost:8080
  description: Ambiente local
tags:
- name: Painel
  description: Os indicadores consolidados da produção, a tela inicial depois do login
- name: Relatórios diários
  description: Abertura, correção e consulta dos relatórios diários de um setor, com os lançamentos de produção, de ração e de mortalidade de cada gaiola
paths:
  /api/v1/dashboard:
    get:
      tags:
      - Painel
      summary: Consultar o cabeçalho do painel
      description: O dia de hoje da granja, a parte do dia, quantos setores ativos têm o relatório de hoje completo e as abas do painel, que são os setores ativos com ao menos um relatório.
      operationId: getDashboardOverview
      responses:
        '200':
          description: Cabeçalho do painel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
              examples:
                granjaComSetores:
                  summary: Três setores ativos, dois com o relatório de hoje completo
                  value:
                    today: '2026-09-24'
                    partOfDay: MORNING
                    activeSectors: 3
                    completeToday: 2
                    sectors:
                    - id: 3f6c2b1a-8d4e-4c7f-9a2b-1e5d7c9f0a11
                      name: Codornas — Galpão 1
                    - id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                      name: Codornas — Galpão 4
                    - id: 7e9a1c3e-5b7d-4f9a-8c1e-3b5d7f9a1c55
                      name: Poedeiras — Galpão 2
                granjaSemRelatorio:
                  summary: Nenhum setor com relatório ainda
                  value:
                    today: '2026-09-24'
                    partOfDay: AFTERNOON
                    activeSectors: 1
                    completeToday: 0
                    sectors: []
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
