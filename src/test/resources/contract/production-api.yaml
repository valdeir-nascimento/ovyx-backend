openapi: 3.1.0
info:
  title: Ovyx — API da Produção
  version: 1.0.0
  description: |
    Relatórios diários dos setores (`DailyReport`): a produção e a mortalidade lançadas por gaiola,
    um relatório por setor e por dia de coleta.

    **Sessão, erros e CSRF**: iguais aos da API de Identidade
    (`specs/001-auth-foundation/contracts/identity-api.yaml`). Toda operação exige o cookie de
    sessão; toda escrita exige o cabeçalho `X-XSRF-TOKEN`; toda recusa segue RFC 9457 com a extensão
    `code`, e a de validação traz **todas** as violações de uma vez em `details`.

    **Perfis**: qualquer responsável autenticado — usuário comum ou administrador — abre, corrige,
    lança e consulta relatórios. Quem abriu e quem fez a última correção ficam registrados pela sessão.

    **Setor inativo**: os relatórios dele continuam consultáveis, e toda escrita é recusada com
    `SECTOR_INACTIVE`. **Nada é apagado**: não há exclusão de relatório nem de lançamento.

    **Quantidades**: inteiras. Como na API da Granja, também são aceitas como texto — o que o
    formulário digitou —, e o que não é inteiro é recusado no próprio campo, junto das demais falhas.
    Nos lançamentos, a classificação e a mortalidade em branco valem zero.
servers:
- url: http://localhost:8080
  description: Ambiente local
tags:
- name: Relatórios diários
  description: Abertura, correção e consulta dos relatórios diários de um setor, com os lançamentos de produção e de mortalidade de cada gaiola
paths:
  /api/v1/sectors/{sectorId}/daily-reports:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags: [Relatórios diários]
      summary: Listar relatórios do setor
      description: Relatórios do setor, do dia mais recente para o mais antigo, com o setor junto. O filtro por data traz o relatório daquele dia, se houver.
      operationId: listDailyReports
      parameters:
      - name: collectionDate
        in: query
        description: Data da coleta (`AAAA-MM-DD`); ausente, todos os relatórios do setor.
        schema:
          type: string
          format: date
        example: '2026-09-24'
      - name: page
        in: query
        description: Página, a partir de 0.
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: size
        in: query
        description: Tamanho da página, de 1 a 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Relatórios encontrados, possivelmente nenhum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportPage'
              examples:
                relatoriosDoSetor:
                  summary: Três dias do Galpão 4, o de hoje ainda pendente
                  value:
                    sector:
                      id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                      name: Codornas — Galpão 4
                      status: ACTIVE
                    content:
                    - id: 8e2a4c6e-0a2c-4e6a-8c0e-2a4c6e8a0c99
                      collectionDate: '2026-09-25'
                      collectionTime: '06:42'
                      openedByName: Marina Alves
                      flockAge: 20
                      collectedEggs: 44
                      removedBirds: 0
                      closingBirdCount: 96
                      productionStatus: PENDING
                      pendingCages: 1
                      mortalityStatus: PENDING
                    - id: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
                      collectionDate: '2026-09-24'
                      collectionTime: '06:30'
                      openedByName: Marina Alves
                      flockAge: 20
                      collectedEggs: 89
                      removedBirds: 2
                      closingBirdCount: 96
                      note: Bebedouro da bateria B trocado.
                      productionStatus: COMPLETE
                      pendingCages: 0
                      mortalityStatus: RECORDED
                    - id: 4f6b8d0f-2b4d-4f6b-9d1f-3b5d7f9b1d11
                      collectionDate: '2026-09-23'
                      collectionTime: '06:35'
                      openedByName: João Pereira
                      flockAge: 20
                      collectedEggs: 91
                      removedBirds: 0
                      closingBirdCount: 98
                      productionStatus: COMPLETE
                      pendingCages: 0
                      mortalityStatus: RECORDED
                    page: 0
                    size: 20
                    totalElements: 3
                    totalPages: 1
        '400':
          $ref: '#/components/responses/FiltroInvalido'
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    post:
      tags: [Relatórios diários]
      summary: Abrir relatório do dia
      description: Abre o relatório de um dia de coleta do setor. As gaiolas ativas do setor entram no relatório como estão agora, sem lançamento.
      operationId: openDailyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReportRequest'
            examples:
              relatorioDeHoje:
                summary: Coleta da manhã
                value:
                  collectionDate: '2026-09-25'
                  collectionTime: '06:42'
                  openingBirdCount: 96
                  flockAge: 20
                  note: Temperatura alta no fim da tarde de ontem.
      responses:
        '201':
          description: Relatório aberto. O cabeçalho `Location` aponta para ele.
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports/8e2a4c6e-0a2c-4e6a-8c0e-2a4c6e8a0c99
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportDetail'
              examples:
                relatorioAberto:
                  summary: Relatório novo, com as duas gaiolas por lançar
                  value:
                    id: 8e2a4c6e-0a2c-4e6a-8c0e-2a4c6e8a0c99
                    sector:
                      id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                      name: Codornas — Galpão 4
                      status: ACTIVE
                    collectionDate: '2026-09-25'
                    collectionTime: '06:42'
                    openingBirdCount: 96
                    flockAge: 20
                    note: Temperatura alta no fim da tarde de ontem.
                    noMortalityConfirmed: false
                    openedBy:
                      id: 1e3a5c7b-9d1f-4b3d-8e5a-7c9e1a3b5d77
                      name: Marina Alves
                    openedAt: '2026-09-25T09:44:03Z'
                    production:
                      status: PENDING
                      pendingCages: 2
                      collectedEggs: 0
                      standardEggs: 0
                      unsellableEggs: 0
                      layingRate: 0.00
                    mortality:
                      status: PENDING
                      deaths: 0
                      culls: 0
                      removalRate: 0.00
                      closingBirdCount: 96
                    cages:
                    - cageId: 2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66
                      code: A-01
                      battery: A
                      number: 1
                      birdCount: 47
                    - cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                      code: B-07
                      battery: B
                      number: 7
                      birdCount: 49
        '400':
          description: Campos inválidos, todos de uma vez (`VALIDATION_FAILED`), ou corpo ilegível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                camposInvalidos:
                  summary: Data futura, aves zeradas e idade fora do intervalo
                  value:
                    code: VALIDATION_FAILED
                    title: Dados inválidos
                    status: 400
                    detail: Dados inválidos.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                    details:
                      collectionDate: A data da coleta não pode ser futura.
                      openingBirdCount: As aves do início do dia devem ficar entre 1 e 1.000.000.
                      flockAge: A idade do lote deve ficar entre 1 e 150 semanas.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/EscritaSemProtecao'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '409':
          description: Já há relatório do setor na data (`DAILY_REPORT_ALREADY_EXISTS`), o setor está inativo (`SECTOR_INACTIVE`), ou não tem gaiola ativa (`SECTOR_WITHOUT_ACTIVE_CAGES`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                relatorioDoDiaExiste:
                  summary: Segundo relatório para o mesmo dia
                  value:
                    code: DAILY_REPORT_ALREADY_EXISTS
                    title: Operação recusada
                    status: 409
                    detail: Já existe o relatório de 24/09/2026 neste setor.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                    details:
                      collectionDate: Já existe o relatório de 24/09/2026 neste setor.
                setorInativo:
                  summary: Relatório num setor inativo
                  value:
                    code: SECTOR_INACTIVE
                    title: Operação recusada
                    status: 409
                    detail: O setor está inativo; os relatórios dele são só para consulta.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
                setorSemGaiola:
                  summary: Setor sem nenhuma gaiola ativa
                  value:
                    code: SECTOR_WITHOUT_ACTIVE_CAGES
                    title: Operação recusada
                    status: 409
                    detail: O setor não tem gaiola ativa. Cadastre as gaiolas antes de abrir o relatório.
                    instance: /api/v1/sectors/5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33/daily-reports
        '415':
          $ref: '#/components/responses/RequisicaoNaoSuportada'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/daily-reports/suggestion:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    get:
      tags: [Relatórios diários]
      summary: Sugerir a abertura do relatório
      description: |
        Valores para o formulário de relatório novo: a data e a hora de agora, no fuso da granja; as
        aves do início do dia pelo saldo do relatório mais recente do setor — ou, sem relatório, pela
        soma das aves das gaiolas ativas —; e a idade do lote pela do relatório mais recente, mais as
        semanas completas passadas desde ele. Sem relatório anterior, a idade não é sugerida.
      operationId: suggestDailyReport
      responses:
        '200':
          description: Sugestão para o relatório novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportSuggestion'
              examples:
                sugestaoPeloAnterior:
                  summary: Saldo e idade do relatório de ontem
                  value:
                    collectionDate: '2026-09-25'
                    collectionTime: '06:42'
                    openingBirdCount: 96
                    flockAge: 20
                primeiroRelatorio:
                  summary: Primeiro relatório do setor, pelas aves das gaiolas
                  value:
                    collectionDate: '2026-09-25'
                    collectionTime: '06:42'
                    openingBirdCount: 98
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/SetorNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
  /api/v1/sectors/{sectorId}/daily-reports/{reportId}:
    parameters:
    - $ref: '#/components/parameters/SectorId'
    - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Relatórios diários]
      summary: Consultar relatório
      description: O relatório com as gaiolas, os lançamentos de cada uma e os totais do dia.
      operationId: findDailyReport
      responses:
        '200':
          description: Relatório encontrado, de setor ativo ou inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportDetail'
              examples:
                relatorioCompleto:
                  summary: Produção completa e uma ocorrência de mortalidade
                  value:
                    id: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
                    sector:
                      id: 5c8d2e4f-6a1b-4c3d-9e7f-0a2b4c6d8e33
                      name: Codornas — Galpão 4
                      status: ACTIVE
                    collectionDate: '2026-09-24'
                    collectionTime: '06:30'
                    openingBirdCount: 98
                    flockAge: 20
                    note: Bebedouro da bateria B trocado.
                    noMortalityConfirmed: false
                    openedBy:
                      id: 1e3a5c7b-9d1f-4b3d-8e5a-7c9e1a3b5d77
                      name: Marina Alves
                    openedAt: '2026-09-24T09:31:40Z'
                    lastCorrectedBy:
                      id: 5d7f9b1d-3f5a-4c7e-9a1b-3d5f7a9c1e88
                      name: João Pereira
                    lastCorrectedAt: '2026-09-24T11:05:12Z'
                    production:
                      status: COMPLETE
                      pendingCages: 0
                      collectedEggs: 89
                      standardEggs: 79
                      unsellableEggs: 4
                      layingRate: 90.82
                    mortality:
                      status: RECORDED
                      deaths: 1
                      culls: 1
                      removalRate: 2.04
                      closingBirdCount: 96
                    cages:
                    - cageId: 2a4c6e8a-0b1d-4f3a-9c5e-7a9b1d3f5a66
                      code: A-01
                      battery: A
                      number: 1
                      birdCount: 48
                      production:
                        eggs: 44
                        small: 1
                        jumbo: 2
                        dirty: 1
                        cracked: 1
                        bloodSpot: 0
                        abnormal: 0
                    - cageId: 9d2e4f6a-1b3c-4d5e-8f7a-2b4c6d8e0f44
                      code: B-07
                      battery: B
                      number: 7
                      birdCount: 50
                      production:
                        eggs: 45
                        small: 0
                        jumbo: 1
                        dirty: 1
                        cracked: 2
                        bloodSpot: 1
                        abnormal: 0
                      mortality:
                        deaths: 1
                        culls: 1
                        note: Prostração e penas eriçadas; uma ave separada para necropsia.
        '401':
          $ref: '#/components/responses/SessaoInvalida'
        '403':
          $ref: '#/components/responses/TrocaDeSenhaPendente'
        '404':
          $ref: '#/components/responses/RelatorioNaoEncontrado'
        '406':
          $ref: '#/components/responses/FormatoIndisponivel'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    put:
      tags: [Relatórios diários]
      summary: Corrigir relatório
      description: Troca os dados gerais do relatório, com as mesmas regras da abertura. As gaiolas e os lançamentos não mudam.
      operationId: correctDailyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReportRequest'
            examples:
              idadeCorrigida:
                summary: Idade do lote corrigida para 21 semanas
                value:
                  collectionDate: '2026-09-24'
                  collectionTime: '06:30'
                  openingBirdCount: 98
                  flockAge: 21
                  note: Bebedouro da bateria B trocado.
      responses:
        '200':
          description: Relatório corrigido, com quem corrigiu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportDetail'
              examples:
                relatorioCorrigido:
                  summary: Idade nova e João como autor da última correção
                  value:
                    id: 6b1d3f5a-7c9e-4a2b-8d4f-1e3a5c7b9d55
                    sector:
